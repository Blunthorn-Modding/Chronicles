<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books &amp; Lore design mockup</title>
  <link rel="icon" href="data:,">
</head>
<body>
<div id="books-lore-review">
  <p class="bl-caption">Design mockup — not connected to Minecraft · native-popup direction, not pixel-exact</p>
  <div class="bl-demo" aria-label="Demo scenario controls"><span>Demo scenario:</span><button type="button" data-scenario="phase">Phase: PAUSED</button><button type="button" data-scenario="target">Target: ready</button><button type="button" data-scenario="book">Book state: unseen</button><button type="button" data-scenario="looked">Looked: supported chest</button></div>
  <div class="bl-app" aria-label="Books and Lore design mockup"></div>
</div>
<style>
#books-lore-review {color-scheme:light dark;font:14px/1.45 ui-monospace,Consolas,monospace;color:light-dark(#272820,#eef0e7)}
#books-lore-review * {box-sizing:border-box} #books-lore-review button,#books-lore-review input,#books-lore-review textarea {font:inherit;color:inherit}
#books-lore-review .bl-caption {margin:0 0 10px;color:light-dark(#575a50,#bfc3b6)}
#books-lore-review .bl-demo {display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 10px;color:var(--dim)}
#books-lore-review .bl-app {--bg:light-dark(#dedfd7,#242720);--panel:light-dark(#f0f1e9,#30352b);--field:light-dark(#fafbf5,#20251d);--text:light-dark(#23261e,#f0f2e9);--dim:light-dark(#555e49,#bcc6b1);--edge:light-dark(#8c9382,#59644d);--selected:light-dark(#c4d2ad,#4e6340);--warn:light-dark(#80431b,#ffc282);background:var(--bg);color:var(--text);border:2px solid var(--edge);min-height:540px;position:relative;container-type:inline-size}
#books-lore-review button,#books-lore-review input,#books-lore-review textarea {border:1px solid var(--edge);border-radius:0;background:var(--field);padding:7px 9px;min-width:0;max-width:100%} #books-lore-review button {background:var(--panel);cursor:pointer} #books-lore-review button:hover:not(:disabled),#books-lore-review button[aria-pressed="true"] {background:var(--selected)} #books-lore-review button:disabled {opacity:.5;cursor:not-allowed} #books-lore-review button:focus-visible,#books-lore-review input:focus-visible,#books-lore-review textarea:focus-visible {outline:2px solid var(--text);outline-offset:2px}
#books-lore-review .bl-header,#books-lore-review .bl-footer {display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--edge)} #books-lore-review .bl-brand {margin-right:auto;font-weight:bold} #books-lore-review .bl-footer {border-top:1px solid var(--edge);border-bottom:0;color:var(--dim);font-size:12px}
#books-lore-review .bl-columns {display:grid;grid-template-columns:132px minmax(160px,.75fr) minmax(260px,1.25fr);min-height:465px} #books-lore-review .bl-nav,#books-lore-review .bl-list {padding:12px 8px;border-right:1px solid var(--edge)} #books-lore-review .bl-nav button,#books-lore-review .bl-row {display:block;width:100%;text-align:left;margin-bottom:6px} #books-lore-review .bl-group {margin:21px 3px 8px;font-size:12px;color:var(--dim)} #books-lore-review .bl-row small {display:block;margin-top:3px;color:var(--dim)} #books-lore-review .bl-detail {background:var(--panel);padding:14px 16px;overflow:auto;max-height:610px} #books-lore-review h2,#books-lore-review h3,#books-lore-review p {margin:0 0 10px} #books-lore-review h2 {font-size:16px} #books-lore-review .bl-actions {display:flex;gap:7px;flex-wrap:wrap;margin:14px 0} #books-lore-review .bl-primary {background:var(--selected)} #books-lore-review .bl-note {font-size:12px;color:var(--dim)} #books-lore-review .bl-warning {font-size:12px;color:var(--warn)} #books-lore-review dl {display:grid;grid-template-columns:105px 1fr;gap:7px 10px;margin:13px 0} #books-lore-review dt {color:var(--dim)} #books-lore-review dd {margin:0} #books-lore-review .bl-debug {border-top:1px solid var(--edge);padding-top:10px;color:var(--dim);font-size:12px}
#books-lore-review .bl-modal-shade {position:absolute;inset:0;z-index:3;padding:22px;display:grid;place-items:center;background:light-dark(#1b211bb8,#0c100cde)} #books-lore-review .bl-modal {background:var(--panel);border:2px solid var(--edge);padding:16px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 25px #0006} #books-lore-review label {display:block;margin:10px 0 5px} #books-lore-review label input,#books-lore-review label textarea {display:block;width:100%;margin-top:4px} #books-lore-review textarea {min-height:150px;resize:vertical} #books-lore-review .bl-rule {display:block;padding:9px;margin:8px 0;border:1px solid var(--edge);cursor:pointer} #books-lore-review .bl-rule:has(input:checked) {background:var(--selected)} #books-lore-review .bl-rule small {display:block;margin:4px 0 0 22px;color:var(--dim)}
#books-lore-review .bl-book {max-width:315px;min-height:320px;margin:12px auto;padding:25px 28px;background:light-dark(#e9dfc3,#534b38);color:light-dark(#352b1f,#fff0cc);border:3px double #765f3b;box-shadow:3px 4px 0 #0004;white-space:pre-wrap} #books-lore-review .bl-book-author {color:inherit;opacity:.75;font-size:12px;margin-bottom:18px} #books-lore-review .bl-pages {display:flex;justify-content:space-between;align-items:center;gap:8px} #books-lore-review .bl-picker-row {display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--edge);padding:9px 0}
@container (max-width:700px) {#books-lore-review .bl-columns {grid-template-columns:112px minmax(0,1fr)} #books-lore-review .bl-detail {display:none} #books-lore-review .bl-app[data-compact-detail="true"] .bl-list {display:none} #books-lore-review .bl-app[data-compact-detail="true"] .bl-detail {display:block} #books-lore-review .bl-back {display:inline-block!important}}
@container (max-width:420px) {#books-lore-review .bl-columns {grid-template-columns:88px minmax(0,1fr)} #books-lore-review .bl-header {padding:9px} #books-lore-review .bl-nav {padding:8px 4px} #books-lore-review .bl-nav button {font-size:12px;padding:7px 4px} #books-lore-review .bl-detail {padding:12px 9px} #books-lore-review .bl-modal-shade {padding:8px} #books-lore-review dl {grid-template-columns:1fr;gap:2px} #books-lore-review dd {margin-bottom:7px}}
</style>
<style>
#books-lore-review .bl-modal textarea {display:block;width:100%;min-height:180px}
#books-lore-review .bl-rule input[type="radio"] {display:inline-block;width:auto;max-width:none;padding:0;margin:0 8px 0 0;vertical-align:middle}
#books-lore-review input[type="checkbox"] {display:inline-block;width:auto;max-width:none;padding:0;margin:0 8px 0 0;vertical-align:middle}
</style>
<style>
#books-lore-review .bl-picker-row {flex-wrap:wrap}
#books-lore-review .bl-picker-row > span {flex:1;min-width:120px}
#books-lore-review .bl-picker-row > input[type="number"] {width:70px;flex:0 0 70px}
</style>
<style>
#books-lore-review .bl-chance {display:flex;align-items:center;gap:4px;flex:0 0 90px;margin:0}
#books-lore-review .bl-chance input[type="number"] {display:inline-block;width:70px;flex:0 0 70px;margin:0}
</style>
<style>
#books-lore-review .bl-number-row {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#books-lore-review .bl-item-row button {width:100%;text-align:left;margin:3px 0}
#books-lore-review .bl-block-outline {width:80px;height:80px;border:2px solid #cf9e35;margin:12px auto}
</style>
<script>
(() => {
  const root=document.querySelector('#books-lore-review .bl-app');
  const books=[
    {id:'quiet_below:field_journal_i',title:'Field journal I',author:'Unknown',description:'Abandoned experiments by a later explorer of the ancient city.',pages:['I found the stair below a seam of dark stone. The buildings beyond it were old long before my arrival. I do not know who laid them out.','I have built a small forge beside the growth. Ordinary coals did nothing. It warmed only after the blue threads reached its base.','Today I lowered a chipped blade and one of the echoing fragments into the basin. I expected slag. The blade survived, and cut deeper than before.'],rule:'until',found:false,issued:false},
    {id:'quiet_below:field_journal_ii',title:'Field journal II',author:'Unknown',description:'Abandoned experiments by a later explorer of the ancient city.',pages:['I have been experimenting with the purple crystals. A sliver of amethyst went into the forge with the pick I have been wearing down in the lower galleries.','The pick looks no different. After days of cutting the same stone, its edge is holding better than the others. I have set aside another crystal to repeat the trial.','I have begun shaping a second stone station. The forge answers objects. I want to know whether a similar arrangement can answer a person.'],rule:'until',found:false,issued:false},
    {id:'quiet_below:field_journal_iii',title:'Field journal III',author:'Unknown',description:'Abandoned experiments by a later explorer of the ancient city.',pages:['The sea-green stone I brought below has survived every heat test. This morning I put a shard into the basin with a spare piece of iron armour.','The plates have not thickened. I put them on for the next test. A blow that bruised my shoulder yesterday barely troubled me today. I checked the padding; it has not changed.','The second station is finished. I have taken to calling it an altar, although there is no one here to dedicate it to. I built it from my own trials, not a plan from the city.'],rule:'until',found:false,issued:false},
    {id:'quiet_below:field_journal_iv',title:'Field journal IV',author:'Unknown',description:'Abandoned experiments by a later explorer of the ancient city.',pages:['Most of the gravel flakes vanished without a useful result. I nearly threw the last piece of flint away, then tried it with the bow I keep beside the stores.','The string draws as it did before. But arrows from this bow now bury themselves farther into the same target. I must mark the distance before the next trial.','The growth has reached the stores. Clearing it takes longer each morning. I need it near the forge, but I can no longer keep my work separate from it.'],rule:'until',found:false,issued:false},
    {id:'quiet_below:field_journal_v',title:'Field journal V',author:'Unknown',description:'Abandoned experiments by a later explorer of the ancient city.',pages:['I tried something lighter today: a fallen feather, with the boots I wear on the upper walkways. Both went into the basin. Only the boots came back.','I tested them from the lowest ledge first. The landing hurt less than it should. I am not willing to trust them from the broken bridge.','I am leaving at first light. I cannot keep the workshop clear and continue the trials. The forge and altar must stay. I will leave these volumes here rather than carry all of them.'],rule:'until',found:false,issued:false}
  ];
  const itemCatalog=['minecraft:apple','minecraft:arrow','minecraft:bread','minecraft:coal','minecraft:compass','minecraft:diamond','minecraft:emerald','minecraft:flint','minecraft:gold_ingot','minecraft:iron_ingot','minecraft:lapis_lazuli','minecraft:map','minecraft:paper','minecraft:raw_iron','minecraft:redstone','minecraft:string','minecraft:torch','minecraft:wheat','minecraft:written_book','minecraft:wooden_pickaxe'];
  const tables=[{id:'quiet_below:forge_notes',title:'Research journals',items:[{id:'minecraft:torch',chance:70,min:4,max:12,components:'{}'},{id:'minecraft:bread',chance:40,min:1,max:3,components:'{}'},{id:'minecraft:compass',chance:15,min:1,max:1,components:'{"minecraft:custom_name":"Mine compass"}'},{id:'minecraft:coal',chance:65,min:3,max:8,components:'{}'}],refill:20,entries:['quiet_below:field_journal_i','quiet_below:field_journal_ii','quiet_below:field_journal_iii','quiet_below:field_journal_iv','quiet_below:field_journal_v'],chances:{'quiet_below:field_journal_i':4,'quiet_below:field_journal_ii':4,'quiet_below:field_journal_iii':4,'quiet_below:field_journal_iv':4,'quiet_below:field_journal_v':4}},{id:'quiet_below:mine_cache',title:'Mine cache',items:[{id:'minecraft:coal',chance:70,min:3,max:8,components:'{}'}],refill:0,entries:[],chances:{}}];
  const chests=[{id:'chest:city-library',physical:'overworld 0 64 0',title:'City library chest (0, 64, 0)',table:'quiet_below:forge_notes',direct:'',chance:4,contents:'3 stacks',history:'session 4; timed 2'},{id:'chest:mine',physical:'overworld 8 64 0',title:'Mine chest (8, 64, 0)',table:'quiet_below:mine_cache',direct:'',chance:20,contents:'2 stacks',history:'session 2'}];
  const looked=[{kind:'supported chest',key:'overworld 20 64 4',title:'Looked-at chest',block:'minecraft:chest'},{kind:'supported barrel',key:'overworld 22 64 4',title:'Looked-at barrel',block:'minecraft:barrel'},{kind:'supported shulker',key:'overworld 24 64 4',title:'Looked-at shulker',block:'minecraft:purple_shulker_box'},{kind:'out of reach',key:'',title:'No container in reach',block:''},{kind:'unsupported',key:'overworld 26 64 4',title:'Unsupported furnace',block:'minecraft:furnace'},{kind:'already bound',key:'overworld 0 64 0',title:'City library chest',block:'minecraft:chest'}];
  const worldContainers=new Map(chests.map(c=>[c.physical,{key:c.physical,title:c.title,block:'minecraft:chest',contents:c.contents,history:c.history,bindingId:c.id}]));
  // Mock world blocks preserve contents/history when a binding is removed.
  for(const target of looked)if(target.key&&!worldContainers.has(target.key))worldContainers.set(target.key,{...target,contents:'Unchanged sample contents',history:'No fill recorded',bindingId:'chest:'+target.key.replaceAll(' ','_')});
  let savedLoot=JSON.parse(JSON.stringify(tables));
  const state={tableSection:'items',section:'Books & Lore',selected:books[1].id,debug:false,compactDetail:false,modal:null,editing:true,phase:'PAUSED',target:'ready',looked:0,pageIndex:0,tableDrafts:{},feedback:'Select a book, then choose an action.'};
  const el=(tag,text='',cls='')=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n};
  const button=(text,fn,opts={})=>{const n=el('button',text,opts.primary?'bl-primary':'');n.type='button';if(opts.disabled)n.disabled=true;if(opts.pressed!==undefined)n.setAttribute('aria-pressed',String(opts.pressed));n.addEventListener('click',fn);return n};
  const current=()=>books.find(b=>b.id===state.selected)||books[0];
  const valid=b=>b.pages.some(p=>p.trim());
  const setupEditable=()=>state.editing&&state.phase!=='ACTIVE';
  const tableDraft=t=>state.tableDrafts[t.id]||(state.tableDrafts[t.id]={items:t.items.map(item=>({...item})),refill:t.refill,entries:[...t.entries],chances:{...(t.chances||{})},itemPage:0,selectedItem:0});
  const chanceValid=value=>String(value).trim()!==''&&Number.isFinite(Number(value))&&Number(value)>=0&&Number(value)<=100;
  const scalar=v=>(typeof v==='string'||typeof v==='number')&&String(v).trim()!==''&&Number.isFinite(Number(v));
  const countValid=v=>scalar(v)&&Number.isInteger(Number(v))&&Number(v)>=1&&Number(v)<=64;
  const tableProblem=d=>{
    if(d.items.length+d.entries.length>27)return 'A loot table can contain at most 27 entries across items and lore books.';
    if(!scalar(d.refill)||Number(d.refill)<0||Number(d.refill)>10080)return 'Refill minutes must be between 0 and 10080.';
    if(d.items.some(i=>!chanceValid(i.chance)))return 'Item chance must be between 0 and 100.';
    if(d.items.some(i=>!countValid(i.min)||!countValid(i.max)||Number(i.min)>Number(i.max)))return 'Use whole counts from 1 to 64, with Min no greater than Max.';
    if(d.entries.some(id=>!chanceValid(d.chances[id]??4)))return 'Lore book chance must be between 0 and 100.';
    return '';
  };
  const tableValid=d=>!tableProblem(d);
  const payload=d=>({items:d.items.map(i=>({...i,chance:Number(i.chance),min:Number(i.min),max:Number(i.max)})),refill:Number(d.refill),entries:[...d.entries],chances:Object.fromEntries(d.entries.map(id=>[id,Number(d.chances[id]??4)]))});
  const dirtyTable=(d,t)=>!tableValid(d)||JSON.stringify(payload(d))!==JSON.stringify(payload(t));
  const itemName=i=>{try{const c=JSON.parse(i.components||'{}');if(typeof c['minecraft:custom_name']==='string')return c['minecraft:custom_name'];}catch{}return i.id.replace('minecraft:','').replaceAll('_',' ')};
  const liveLooked=()=>looked[state.looked];
  const supported=t=>Boolean(t.key)&&['minecraft:chest','minecraft:barrel','minecraft:purple_shulker_box'].includes(t.block);
  const boundAt=t=>chests.find(c=>c.physical===t.key);
  const bindable=()=>supported(liveLooked())&&!boundAt(liveLooked());
  function selectTable(t,section='items'){state.section='Loot Tables';state.selected=t.id;state.tableSection=section;state.compactDetail=true;render()}
  function updateField(input,apply){input.addEventListener('change',()=>{apply(input.value);render()})}

  const ruleText=r=>({off:'Distribution off',once:'Spawn once',until:'Until found',repeat:'Repeat'}[r]);
  const removeChildren=n=>{while(n.firstChild)n.firstChild.remove()};
  function closeModal(){state.modal=null;render()}
  function openPreview(book,returnTo){state.modal={kind:'preview',book,returnTo};state.pageIndex=0;render()}
  function nav(){const n=el('nav','','bl-nav');['Session','Players','Events'].forEach(x=>n.append(button(x,()=>{state.feedback='This mockup focuses on Books & Lore.'})));n.append(el('div','Advanced','bl-group'));['Chests','Loot Tables','Books & Lore','Regions','Locations','Game setup'].forEach(x=>n.append(button(x,()=>{state.section=x;state.compactDetail=false;render()},{pressed:state.section===x})));return n}
  function list(){const pane=el('section','','bl-list');if(state.section==='Books & Lore'){pane.append(button('+ New book',newBook,{primary:true,disabled:!setupEditable()}));books.forEach(b=>{const r=button(b.title,()=>{state.selected=b.id;state.compactDetail=true;render()});r.className='bl-row';r.setAttribute('aria-pressed',String(b.id===state.selected));if(state.debug)r.append(el('small',`${b.description} · ${b.id}`));pane.append(r)})}else if(state.section==='Chests'){chests.forEach(c=>{const r=button(c.title,()=>{state.selected=c.id;state.compactDetail=true;render()});r.className='bl-row';r.append(el('small',c.direct?'Specific lore book set':'Normal loot table only'));pane.append(r)})}else if(state.section==='Loot Tables'){tables.forEach(t=>{const r=button(t.title,()=>{state.selected=t.id;state.tableSection='items';state.compactDetail=true;render()});r.className='bl-row';r.setAttribute('aria-pressed',String(t.id===state.selected));r.append(el('small',`${t.items.length} items; ${t.entries.length} lore books`));pane.append(r)})}else pane.append(el('p','This navigation destination is shown only to preserve the accepted Core menu structure.','bl-note'));return pane}
  function details(){
    const d=el('section','','bl-detail'),back=button('Back to list',()=>{state.compactDetail=false;render()});
    back.className='bl-back';back.style.display='none';d.append(back);
    if(state.section==='Loot Tables')return lootDetail(d);
    if(state.section==='Chests')return chestDetail(d);
    if(state.section!=='Books & Lore'){d.append(el('h2',state.section),el('p','Outside this design review.','bl-note'));return d;}
    const b=current(),appears=tables.filter(t=>t.entries.includes(b.id)),directs=chests.filter(c=>c.direct===b.id);
    d.append(el('h2',b.title),el('p',b.description),el('p',`Author: ${b.author||'None'} - ${b.pages.length} pages`,'bl-note'));
    d.append(el('p',`Distribution: ${ruleText(b.rule)}${b.rule==='until'?b.found?' - Found':' - Not found':''}`,'bl-note'));
    const actions=el('div','','bl-actions');
    actions.append(button('Edit details',()=>editDetails(b),{disabled:!setupEditable()}),button('Edit pages',()=>editPages(b),{disabled:!setupEditable()}),button('Preview',()=>openPreview(b,null)),button('Distribution...',()=>editRule(b),{disabled:!setupEditable()}),button('Place now...',()=>{state.modal={kind:'place-chest',book:b};render()},{disabled:state.phase!=='ACTIVE'}));d.append(actions,el('h3','Direct chests'));
    const open=t=>{state.section='Loot Tables';state.selected=t.id;state.tableSection='lore';state.compactDetail=true;render()};
    directs.forEach(c=>{const row=el('div','','bl-picker-row');row.append(el('span',c.title),button('Open chest',()=>{state.section='Chests';state.selected=c.id;state.compactDetail=true;render()}));d.append(row)});
    if(!directs.length)d.append(el('p','No direct chest settings.','bl-note'));
    d.append(el('h3','Loot tables'));
    appears.forEach(t=>{const row=el('div','','bl-picker-row');row.append(el('span',t.title),button('Open table',()=>open(t)));d.append(row)});
    if(!appears.length)d.append(el('p','No loot-table references.','bl-note'),button('Choose loot table',()=>{state.section='Loot Tables';state.selected=tables[0].id;state.tableSection='lore';state.compactDetail=true;render()}));
    if(!valid(b))d.append(el('p','Write at least one nonblank page before enabling distribution.','bl-warning'));
    if(state.debug){const debug=el('div','','bl-debug');debug.append(el('strong','Debug'),el('p',`ID: ${b.id} (custom identities are assigned by the server)`),el('p',`Issued: ${b.issued?'yes':'no'} - Found by inventory receipt: ${b.found?'yes':'no'}`));d.append(debug)}
    return d;
  }
  function syncTableUi(t,d){
    const pane=root.querySelector('.bl-detail');if(!pane)return;
    const dirty=dirtyTable(d,t),problem=tableProblem(d);
    pane.querySelector('[data-table-save]').disabled=!setupEditable()||!dirty||Boolean(problem);
    pane.querySelector('[data-table-discard]').disabled=!dirty;
    pane.querySelector('[data-table-error]').textContent=problem;
    pane.querySelector('[data-table-dirty]').textContent=dirty?'Unsaved table changes.':'';
    pane.querySelectorAll('[data-item-index]').forEach(button=>{const index=Number(button.dataset.itemIndex),i=d.items[index];if(i)button.textContent=`${index===d.selectedItem?'> ':''}${itemName(i)} ${i.chance}% x${i.min}-${i.max}`});
  }
  function draftNumber(label,value,set,table,draft,kind='chance'){
    const l=el('label',label),f=document.createElement('input');f.type='number';f.value=String(value);f.disabled=!setupEditable();f.min=kind==='count'?'1':'0';f.max=kind==='refill'?'10080':kind==='count'?'64':'100';f.step=kind==='count'?'1':'any';
    f.addEventListener('input',()=>{set(f.value);syncTableUi(table,draft)});l.append(f);return l;
  }
  function lootDetail(d){
    const t=tables.find(x=>x.id===state.selected)||tables[0],draft=tableDraft(t),dirty=dirtyTable(draft,t);
    d.append(el('h2',t.title),el('p','Edit independent rolls and the shared refill interval. Saving fills no chest.','bl-note'));
    const actions=el('div','','bl-actions'),save=button('Save loot table',()=>{state.modal={kind:'table-confirm',table:t};render()},{disabled:!setupEditable()||!dirty||!tableValid(draft)}),discard=button('Discard changes',()=>{delete state.tableDrafts[t.id];render()},{disabled:!dirty});
    save.dataset.tableSave='';discard.dataset.tableDiscard='';actions.append(save,discard,button('Reload loot configuration',()=>{state.modal={kind:'reload-confirm',table:t};render()},{disabled:!setupEditable()}));d.append(actions);

  function render(){removeChildren(root);root.dataset.compactDetail=String(state.compactDetail);const header=el('header','','bl-header');header.append(el('span','Chronicle','bl-brand'),button('Refresh',()=>{state.feedback='Mockup refreshed.'}),button(`Debug: ${state.debug?'on':'off'}`,()=>{state.debug=!state.debug;render()},{pressed:state.debug}),button(state.editing?'Stop editing':'Enable editing',()=>{state.editing=!state.editing;render()},{disabled:state.phase==='ACTIVE'}));root.append(header);const columns=el('main','','bl-columns');columns.append(nav(),list(),details());root.append(columns);const footer=el('footer',state.feedback,'bl-footer');root.append(footer);const overlay=modal();if(overlay){root.append(overlay);if(!setupEditable()&&!state.modal.kind.startsWith('place-')){const saves=new Set(['Create and edit pages','Save details','Save pages','Save rule','Confirm rule','Save chest setting','Clear and save','Confirm table save','Confirm reload','Confirm bind','Confirm table change','Confirm unbind','Add']);overlay.querySelectorAll('button').forEach(b=>{if(saves.has(b.textContent))b.disabled=true})}}document.querySelector('[data-scenario="phase"]').textContent=`Phase: ${state.phase}`;document.querySelector('[data-scenario="target"]').textContent=`Target: ${state.target}`;const lookedButton=document.querySelector('[data-scenario="looked"]');lookedButton.textContent=`Looked: ${liveLooked().title}`;const bookButton=document.querySelector('[data-scenario="book"]');bookButton.disabled=state.section!=='Books & Lore';bookButton.textContent=`Book state: ${current().found?'found':current().issued?'issued':'unseen'}`}
  document.querySelector('[data-scenario="looked"]').addEventListener('click',()=>{state.looked=(state.looked+1)%looked.length;render()});
  document.querySelector('[data-scenario="book"]').addEventListener('click',()=>{const b=current();if(!b.issued)b.issued=true;else if(!b.found)b.found=true;else{b.issued=false;b.found=false}render()});
  document.querySelector('[data-scenario="phase"]').addEventListener('click',()=>{state.phase=state.phase==='ACTIVE'?'PAUSED':'ACTIVE';if(state.phase==='ACTIVE')state.editing=false;render()});document.querySelector('[data-scenario="target"]').addEventListener('click',()=>{state.target=state.target==='ready'?'full':state.target==='full'?'unloaded':'ready';render()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){event.preventDefault();const m=state.modal;state.modal=m.kind==='remove-page'?m.editor:m.returnTo||null;render()}});render();
})();
