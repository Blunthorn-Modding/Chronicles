<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ancient Forge workstation mockup</title><style>
:root{color-scheme:dark;font-family:monospace}*{box-sizing:border-box}body{margin:0;padding:56px 16px 16px;min-width:max-content;background:#151515;color:#eee}.controls{position:fixed;z-index:2;top:10px;left:10px;padding:8px;border:2px solid #666;background:#292929}select{margin:0 8px;background:#111;color:#fff;font:inherit}.canvas{position:relative;width:640px;height:480px;overflow:hidden;background:#282c2e}.canvas[data-size="1280"]{width:1280px;height:720px}.panel{position:absolute;width:176px;height:166px;transform:scale(2);transform-origin:top left;background:#303030;color:#fff;font:9px/9px monospace}.canvas[data-size="640"] .panel{left:144px;top:74px}.canvas[data-size="1280"] .panel{left:464px;top:194px}.title{position:absolute;top:6px;width:100%;text-align:center}.assetnote{position:absolute;left:8px;top:75px;color:#aaa;font-size:7px}.status{position:absolute;left:8px;top:66px;width:108px;white-space:nowrap;overflow:hidden}.slot{position:absolute;width:16px;height:16px;border:0;background:#777;color:#fff;font:8px monospace}.slot:hover{outline:1px solid #fff}.target{left:49px;top:19px}.ingredient{left:49px;top:40px}.result{left:129px;top:34px;background:#9a9a9a}.recipes{position:absolute;left:120px;top:60px;width:48px;height:20px;border:0;background:#9a9a9a;color:#222;font:9px monospace}.inventory{position:absolute;left:8px;top:84px;display:grid;grid-template-columns:repeat(9,16px);gap:2px}.hotbar{position:absolute;left:8px;top:142px;display:grid;grid-template-columns:repeat(9,16px);gap:2px}.item{width:16px;height:16px;background:#777}.panel[data-state="unpowered"] .result,.panel[data-state="paused"] .result,.panel[data-state="incompatible"] .result,.panel[data-state="capped"] .result{background:#555;color:#999}
</style></head><body><label class="controls">Canvas <select id="size"><option value="640">640 × 480</option><option value="1280">1280 × 720</option></select> State <select id="state"><option value="ready">Ready</option><option value="unpowered">Unpowered</option><option value="paused">Paused</option><option value="incompatible">Incompatible</option><option value="capped">Capped</option></select></label><main class="canvas" data-size="640"><section class="panel" data-state="ready"><div class="title">Ancient Forge</div><div class="assetnote">Grindstone layout — native art not imitated</div><button class="slot target" title="Target item">T</button><button class="slot ingredient" title="Ingredient">I</button><button class="slot result" title="Take result">R</button><div class="status" id="status">Forge ready</div><button class="recipes" type="button">Recipes</button><div class="inventory" id="inventory"></div><div class="hotbar" id="hotbar"></div></section></main><script>
const canvas=document.querySelector('.canvas'),panel=document.querySelector('.panel'),state=document.querySelector('#state'),status=document.querySelector('#status');for(const id of ['inventory','hotbar'])for(let i=0;i<(id==='inventory'?27:9);i++){const e=document.createElement('span');e.className='item';document.querySelector('#'+id).append(e)}document.querySelector('#size').onchange=e=>canvas.dataset.size=e.target.value;state.onchange=e=>{const v=e.target.value;panel.dataset.state=v;status.textContent={ready:'Forge ready',unpowered:'Forge is unpowered',paused:'Forge is quiet',incompatible:'These will not bind',capped:'The result is unchanged'}[v]};
</script></body></html>
