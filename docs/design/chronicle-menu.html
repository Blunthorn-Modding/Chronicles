<div id="chronicle-menu-review">
  <div class="cm-caption">Interactive design proposal · example data · no connection to Minecraft</div>
  <div class="viz-carousel" aria-label="Chronicle menu layouts">
    <section data-variant="Three panes" aria-label="Three pane Chronicle menu"><div class="cm-mount" data-layout="wide"></div></section>
    <section data-variant="Compact drilldown" aria-label="Compact Chronicle menu" hidden><div class="cm-mount" data-layout="compact"></div></section>
  </div>
</div>
<style>
#chronicle-menu-review {color-scheme:light dark;font:14px/1.45 ui-monospace,Consolas,monospace;color:light-dark(#272820,#eef0e7)}
#chronicle-menu-review * {box-sizing:border-box}
#chronicle-menu-review p,#chronicle-menu-review dl,#chronicle-menu-review dt,#chronicle-menu-review dd,#chronicle-menu-review label,#chronicle-menu-review details,#chronicle-menu-review summary,#chronicle-menu-review code {font-family:inherit}
#chronicle-menu-review .cm-caption {margin:0 0 10px;color:light-dark(#575a50,#bfc3b6)}
#chronicle-menu-review .cm-mount {container-type:inline-size}
#chronicle-menu-review .cm-mount[data-layout="compact"] {max-width:590px;margin:auto}
#chronicle-menu-review .cm-app {--cm-bg:light-dark(#dedfd7,#242720);--cm-panel:light-dark(#f0f1e9,#30352b);--cm-field:light-dark(#fafbf5,#20251d);--cm-text:light-dark(#23261e,#f0f2e9);--cm-dim:light-dark(#555e49,#bcc6b1);--cm-edge:light-dark(#8c9382,#59644d);--cm-selected:light-dark(#c4d2ad,#4e6340);--cm-button:light-dark(#d9decf,#414b38);--cm-warning:light-dark(#80431b,#ffc282);background:var(--cm-bg);color:var(--cm-text);border:2px solid var(--cm-edge);min-height:570px;position:relative;overflow-wrap:anywhere}
#chronicle-menu-review h2,#chronicle-menu-review h3 {font:500 16px/1.35 ui-monospace,Consolas,monospace;margin:0 0 9px}
#chronicle-menu-review p {margin:8px 0}
#chronicle-menu-review button,#chronicle-menu-review input,#chronicle-menu-review select {font:inherit;color:inherit;border:1px solid var(--cm-edge);border-radius:0;background:var(--cm-button);padding:7px 9px;max-width:100%;min-width:0}
#chronicle-menu-review button:hover:not(:disabled) {background:var(--cm-selected)}
#chronicle-menu-review button:disabled {opacity:.5;cursor:not-allowed}
#chronicle-menu-review button:focus-visible,#chronicle-menu-review input:focus-visible,#chronicle-menu-review select:focus-visible {outline:2px solid var(--cm-text);outline-offset:2px}
#chronicle-menu-review button[aria-pressed="true"],#chronicle-menu-review button[aria-current="page"] {background:var(--cm-selected);border-color:var(--cm-text)}
#chronicle-menu-review .cm-header {display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px;border-bottom:1px solid var(--cm-edge)}
#chronicle-menu-review .cm-brand {font-weight:500;margin-right:auto}
#chronicle-menu-review .cm-state {color:var(--cm-dim)}
#chronicle-menu-review .cm-columns {display:grid;grid-template-columns:150px minmax(170px, .82fr) minmax(260px,1.18fr);min-height:470px}
#chronicle-menu-review .cm-nav {padding:12px 8px;border-right:1px solid var(--cm-edge)}
#chronicle-menu-review .cm-nav button {display:block;width:100%;text-align:left;margin-bottom:5px}
#chronicle-menu-review .cm-group {font-size:12px;color:var(--cm-dim);margin:22px 3px 8px}
#chronicle-menu-review .cm-list {padding:14px 10px;border-right:1px solid var(--cm-edge);min-width:0}
#chronicle-menu-review .cm-row {width:100%;text-align:left;display:block;margin-bottom:7px;background:var(--cm-panel)}
#chronicle-menu-review .cm-row span {display:block;color:var(--cm-dim);font-size:12px;margin-top:3px}
#chronicle-menu-review .cm-detail {padding:var(--cm-review-spacing,14px) 16px;min-width:0;background:var(--cm-panel)}
#chronicle-menu-review .cm-kicker {color:var(--cm-dim);font-size:12px;margin-bottom:8px}
#chronicle-menu-review .cm-subnav {display:flex;flex-wrap:wrap;gap:5px;margin:0 0 16px}
#chronicle-menu-review .cm-subnav button {font-size:12px;padding:5px 7px}
#chronicle-menu-review .cm-actions {display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
#chronicle-menu-review .cm-primary {background:var(--cm-selected);border:1px solid var(--cm-text)}
#chronicle-menu-review .cm-note {color:var(--cm-dim);font-size:12px}
#chronicle-menu-review .cm-reason {color:var(--cm-warning);margin:10px 0;font-size:12px}
#chronicle-menu-review .cm-quote {background:var(--cm-field);padding:13px;border-left:3px solid var(--cm-edge);margin:12px 0}
#chronicle-menu-review label {display:block;margin:13px 0 5px}
#chronicle-menu-review label input,#chronicle-menu-review label select {display:block;width:100%;margin-top:5px;background:var(--cm-field)}
#chronicle-menu-review dl {display:grid;grid-template-columns:minmax(70px, .65fr) minmax(0,1fr);gap:8px 12px;margin:15px 0}
#chronicle-menu-review dt {color:var(--cm-dim)}
#chronicle-menu-review dd {margin:0}
#chronicle-menu-review .cm-footer {padding:10px 13px;border-top:1px solid var(--cm-edge);display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px}
#chronicle-menu-review .cm-feedback {flex:1;min-width:120px}
#chronicle-menu-review .cm-command {display:block;margin:18px 0 0;padding:9px;background:var(--cm-field);font-size:12px;white-space:normal}
#chronicle-menu-review .cm-back {display:none;margin:0 0 12px}
#chronicle-menu-review .cm-modal-shade {position:absolute;inset:0;background:light-dark(#1b211bb8,#0c100cde);display:grid;align-items:start;padding:40px 20px;z-index:2}
#chronicle-menu-review .cm-modal {background:var(--cm-panel);color:var(--cm-text);border:2px solid var(--cm-edge);padding:20px;max-width:480px;width:100%;margin:auto;box-shadow:0 8px 25px #0005}
#chronicle-menu-review .cm-modal label {margin:9px 0}
#chronicle-menu-review .cm-closed {min-height:570px;display:grid;place-content:center;text-align:center;gap:10px}
#chronicle-menu-review .cm-planned {color:var(--cm-warning);font-size:12px}
#chronicle-menu-review .cm-loot-row {display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:6px;align-items:end}
#chronicle-menu-review .cm-loot-row label {font-size:12px}
#chronicle-menu-review .cm-mount[data-layout="compact"] .cm-columns {grid-template-columns:130px minmax(0,1fr)}
#chronicle-menu-review .cm-mount[data-layout="compact"] .cm-detail {display:none}
#chronicle-menu-review .cm-mount[data-layout="compact"] .cm-app[data-view="detail"] .cm-list {display:none}
#chronicle-menu-review .cm-mount[data-layout="compact"] .cm-app[data-view="detail"] .cm-detail {display:block}
#chronicle-menu-review .cm-mount[data-layout="compact"] .cm-back {display:inline-block}
@container (max-width:710px) {
 #chronicle-menu-review .cm-columns {grid-template-columns:130px minmax(0,1fr)}
 #chronicle-menu-review .cm-detail {display:none}
 #chronicle-menu-review .cm-app[data-view="detail"] .cm-list {display:none}
 #chronicle-menu-review .cm-app[data-view="detail"] .cm-detail {display:block}
 #chronicle-menu-review .cm-back {display:inline-block}
}
@container (max-width:410px) {
 #chronicle-menu-review .cm-columns,#chronicle-menu-review .cm-mount[data-layout="compact"] .cm-columns {grid-template-columns:94px minmax(0,1fr)}
 #chronicle-menu-review .cm-header {padding:10px}
 #chronicle-menu-review .cm-nav {padding:8px 4px}
 #chronicle-menu-review .cm-nav button {padding:8px 4px;font-size:12px}
 #chronicle-menu-review .cm-detail {padding:12px 9px}
 #chronicle-menu-review .cm-group {font-size:11px}
 #chronicle-menu-review dl {grid-template-columns:1fr;gap:3px}
 #chronicle-menu-review dd {margin-bottom:7px}
 #chronicle-menu-review .cm-modal-shade {padding:20px 6px}
 #chronicle-menu-review .cm-modal {padding:13px}
 #chronicle-menu-review .cm-loot-row {grid-template-columns:1fr}
}
@media (pointer:coarse) {#chronicle-menu-review button,#chronicle-menu-review select,#chronicle-menu-review input {min-height:44px}}
</style>
<script>
(() => {
 const root = document.getElementById('chronicle-menu-review');
 const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const nav = ['Session','Players','Events','Chests','Regions','Locations','Game setup'];
 const events = [
  {id:'city',name:'City vibration',key:'quiet_below:city_presence',type:'Message & sound',text:'The ancient stone carries a low vibration.',sound:'minecraft:ambient.cave',local:true},
  {id:'stir',name:'Distant stirring',key:'quiet_below:distant_stir',type:'Message & sound',text:'A low, unfamiliar rumble breaks the quiet.',sound:'minecraft:ambient.cave',local:false},
  {id:'check',name:'Readiness check',key:'quiet_below:readiness_check',type:'Game action',text:'Records the readiness_checked game condition. Changes no blocks or inventories.',sound:'',local:false}
 ];
 const planned = [
  ['Encounters','Events → Encounters','Entity groups, safe spawn areas, counts, waves, start/stop and recovery. Separate effect service; not implemented.'],
  ['Player groups','Players → Groups','Review exact members before participation or destination changes. No implicit factions.'],
  ['Private character roles','Players → Private game data','Werewolf roles, teams, elimination and private messages. Separate protected state, never the public card.'],
  ['Phases & voting','Session / Events → registered game tools','Only a supporting game supplies phases, votes, win rules and permitted actions.'],
  ['Journey chapters','Session → Chapters & outcomes','Two or three chapter outcomes; review next world and character/inventory transfer. No transition engine exists yet.'],
  ['Chapter links','Game setup → Chapter links','Choose authored next worlds and validate each outcome without changing the current world.'],
  ['Objectives & threats','Session → Objectives; Events → Encounters','Survival objectives, escalation, respite, and explicit GM intervention. Scenario rules remain separate.'],
  ['Game extensions','Game setup → Game tools','Campaign-provided panels. Quiet Below owns growth, benefits, stations and Heart eradication; Core supplies selectors and shell.'],
  ['Loot editor','Chests → Loot types','Proposed native editor for independent chances, counts, components and refill timing. JSON stays supported.'],
  ['Recovery & history','Session → Checks & recovery / Activity','Inspect unresolved actions and reconcile only when the responsible handler supports it. No blind retry.'],
  ['Optional formats','Registered Session / Events panels','Operation objectives/extraction and Intrigue decisions remain optional candidates, not installed engines.']
 ];
 root.querySelectorAll('.cm-mount').forEach((mount, index) => {
  let saved = window.openai?.widgetState?.privateContent?.menus?.[index];
  const s = {section:'Events',item:'city',page:'Overview',phase:'PAUSED',edit:false,view:'list',closed:false,feedback:'Example session. Changes here affect this preview only.',modal:null,
   region:null,trigger:'Manual',delay:'60',flag:'None',complete:false,participant:true,guestParticipant:true,arrival:false,respawn:false,assigned:false,corners:0,first:true,
   points:['Village arrival'],blocks:['Ancient forge'],regions:['Mine entrance','Source city boundary'],chests:['Mine cache'],lootChance:'65'};
  if (saved && nav.includes(saved.section)) { s.section=saved.section; s.item=saved.item || ''; s.page='Overview'; }
  const eventStates = Object.fromEntries(events.map(e=>[e.id,{region:null,trigger:'Manual',delay:'60',flag:'None',complete:false}]));
  const playerStates = {self:{arrival:false,respawn:false,arrivalPoint:'Village arrival',respawnPoint:'Village arrival'},guest:{arrival:false,respawn:false,arrivalPoint:'Village arrival',respawnPoint:'Village arrival'}};
  const remembered = {};
  function saveContext() {
   if(s.section==='Events'&&eventStates[s.item]) for(const key of Object.keys(eventStates[s.item])) eventStates[s.item][key]=s[key];
   if(s.section==='Players'&&playerStates[s.item]) for(const key of Object.keys(playerStates[s.item])) playerStates[s.item][key]=s[key];
  }
  function loadContext() {
   const data=s.section==='Events'?eventStates[s.item]:s.section==='Players'?playerStates[s.item]:null;
   if(data)Object.assign(s,data);
  }
  const participating = () => s.item==='guest'?s.guestParticipant:s.participant;
  const editAllowed = () => s.edit && s.phase !== 'ACTIVE';
  const button = (label,action,primary=false,disabled=false) => `<button type="button" data-act="${action}"${primary?' class="cm-primary"':''}${disabled?' disabled':''}>${escape(label)}</button>`;
  const row = (id,label,detail='') => `<button type="button" class="cm-row" data-item="${escape(id)}" aria-pressed="${s.item===id}">${escape(label)}${detail?`<span>${escape(detail)}</span>`:''}</button>`;
  const sub = labels => `<div class="cm-subnav">${labels.map(label=>`<button type="button" data-page="${escape(label)}" aria-pressed="${s.page===label}">${escape(label)}</button>`).join('')}</div>`;
  const kv = values => `<dl>${values.map(([k,v])=>`<dt>${escape(k)}</dt><dd>${escape(v)}</dd>`).join('')}</dl>`;
  const command = text => `<details class="cm-command"><summary>Command equivalent · proposed</summary><code>${escape(text)}</code></details>`;
  const reason = () => !editAllowed()?`<p class="cm-reason">${s.phase==='ACTIVE'?'Pause the session before changing setup.':'Enable editing to change saved setup.'}</p>`:'';
  const event = () => events.find(e=>e.id===s.item) || events[0];
  const persist = () => {
   const old = window.openai?.widgetState?.privateContent?.menus || {};
   if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{section:s.section,layout:mount.dataset.layout},privateContent:{menus:{...old,[index]:{section:s.section,item:s.item,page:s.page}}}}).catch(()=>{});
  };
  function items() {
   if(s.section==='Session') return row('current','Current session','Pause, resume and end play')+row('activity','Activity','Session, events, player moves, loot')+row('recovery','Checks & recovery','References and unresolved operations');
   if(s.section==='Players') return row('self','SchinderRenge',s.participant?'Participating · online':'Not participating · online')+row('guest','ExampleGuest',s.guestParticipant?'Participating · online':'Not participating · online');
   if(s.section==='Events') return events.map(e=>row(e.id,e.name,e.type+(e.id==='city'&&!(e.id===s.item?s.region:eventStates[e.id].region)?' · Needs audience region':''))).join('')+row('conditions','Game conditions','Named true / false prerequisites');
   if(s.section==='Chests') return s.chests.map((c,i)=>row('chest'+i,c,'Bound chest · Mine cache type')).join('')+row('loot','Loot types','Chances, counts and refill settings')+button('Bind looked-at chest…','add-chest',false,!editAllowed());
   if(s.section==='Regions') return s.regions.map((r,i)=>row('region'+i,r,'Saved area · view bounds and usage')).join('')+button('Create region…','add-region',false,!editAllowed());
   if(s.section==='Locations') return `<div class="cm-kicker">Points · position and facing</div>`+s.points.map((p,i)=>row('point'+i,p,'Point · overworld')).join('')+`<div class="cm-kicker">Block sites · exact block</div>`+s.blocks.map((p,i)=>row('block'+i,p,'Block site · expected block type')).join('')+button('Save my position…','add-point',false,!editAllowed())+`<p></p>`+button('Bind looked-at block…','add-block',false,!editAllowed());
   return row('requirements','Map requirements','Assign saved regions, points or blocks')+row('future','Planned tools','Design reference · future library features');
  }
  function eventDetail() {
   if(s.item==='conditions') return `<h2>Game conditions</h2><p>A named true/false value used by a game or an event prerequisite.</p>${kv([['Readiness checked','False'],['Used by','Readiness check']])}<div class="cm-actions">${button('Set condition…','condition',false,s.phase!=='ACTIVE')}</div><p class="cm-note">Current live flags can be changed during ACTIVE only. Configuration-time definitions are a separate future feature.</p>${command('/chronicle events conditions get quiet_below:readiness_checked')}`;
   const e=event();
   let content = '';
   if(s.page==='Automatic trigger') content=`<p>Choose when this event may run automatically.</p><label>Trigger<select data-field="trigger" ${!editAllowed()?'disabled':''}>${['Manual','On entering a region','After active play time','When a condition is true'].map(t=>`<option${s.trigger===t?' selected':''}>${t}</option>`).join('')}</select></label>${s.trigger==='On entering a region'?`<label>Entry region<select data-field="region" ${!editAllowed()?'disabled':''}><option value="">Choose region</option>${s.regions.map(r=>`<option${s.region===r?' selected':''}>${r}</option>`).join('')}</select></label><p class="cm-note">This event uses the same region for entry and its region-based audience.</p>`:''}${s.trigger==='After active play time'?`<label>Delay · seconds of active, occupied play<input data-field="delay" type="number" min="1" max="604800" value="${escape(s.delay)}" ${!editAllowed()?'disabled':''}></label><p class="cm-note">Pauses with the session, empty play and unresolved operations. No real-world catch-up.</p>`:''}${s.trigger==='When a condition is true'?`<label>Required game condition<select data-field="flag" ${!editAllowed()?'disabled':''}><option value="None">Choose a condition</option><option${s.flag==='Readiness checked'?' selected':''}>Readiness checked</option></select></label>`:''}${reason()}<div class="cm-actions">${button('Save trigger','save-trigger',true,!editAllowed())}${button('Disable automatic trigger…','disable-trigger',false,!editAllowed())}</div>`;
   else if(s.page==='Audience & requirements') content=`<label>Audience<select data-field="audience" disabled><option>${e.local?'Participants in a region':'All participating players'}</option></select></label><p class="cm-note">The game defines who can receive this event.</p>${e.local?`<p>Audience region: <strong>${escape(s.region||'Not assigned')}</strong></p>${button('Choose audience region…','pick-region',false,!editAllowed())}`:'<p>No region is needed for this audience.</p>'}<label>Prerequisite<select data-field="flag" ${!editAllowed()?'disabled':''}><option${s.flag==='None'?' selected':''}>None</option><option${s.flag==='Readiness checked'?' selected':''}>Readiness checked</option></select></label>${reason()}<div class="cm-actions">${button('Save requirements','save-requirements',true,!editAllowed())}</div>`;
   else if(s.page==='History') content=kv([['Completion',s.complete?'Delivered once':'Not delivered'],['Automatic retry','Never after an uncertain claim'],['Reset','Explicitly permits another run']])+`<div class="cm-actions">${button('Allow event again…','reset-event',false,!editAllowed()||!s.complete)}</div>${reason()}`;
   else content=`<p>${e.type==='Message & sound'?'A public message and optional sound sent to the selected audience.':'A registered game-state action with its own validation and history.'}</p><div class="cm-quote">${escape(e.text)}</div>${kv([['Trigger',s.item==='city'?s.trigger:'Manual'],['Audience',e.type==='Game action'?'Game state; no player audience':e.local?(s.region||'Choose an audience region'):'All participating players'],['Status',s.complete?'Completed':e.local&&!s.region?'Setup incomplete':'Available for live checks']])}<div class="cm-actions">${button('Preview event','preview-event',true)}${button(e.type==='Game action'?'Check readiness':'Check live audience','check-event')}${button('Run event…','run-event',false,s.phase!=='ACTIVE'||s.complete||(e.local&&!s.region))}</div><p class="cm-note">Preview works now, including before a region is assigned. It sends no cue to players.</p>${s.phase!=='ACTIVE'?'<p class="cm-reason">Start or resume the session to run this event.</p>':''}${e.local&&!s.region?'<p class="cm-reason">An audience region is needed to run this event, but not to preview its content.</p>':''}`;
   const triggerCommand=s.trigger==='After active play time'?'timer '+e.key+' '+s.delay:s.trigger==='On entering a region'?'entry '+e.key+' '+(s.region||'<region>').toLowerCase().replaceAll(' ','_'):s.trigger==='When a condition is true'?'condition '+e.key+' quiet_below:readiness_checked':'manual '+e.key;
   return `<div class="cm-kicker">${e.type} · The Quiet Below</div><h2>${e.name}</h2>${sub(e.type==='Game action'?['Overview','History']:['Overview','Automatic trigger','Audience & requirements','History'])}${content}${command('/chronicle events '+(s.page==='Automatic trigger'?'trigger '+triggerCommand:s.page==='History'?'history '+e.key:'preview '+e.key))}`;
  }
  function movement(name) {
   return `<h3>Move now</h3><p>Choose a saved point and review safety before moving ${name}.</p>${button('Move player…','move-player',true,s.phase!=='ACTIVE')}<h3 style="margin-top:20px">Automatic destinations</h3>${kv([['First arrival',s.arrival?'Once → '+s.arrivalPoint:'Off'],['After death',s.respawn?'Point → '+s.respawnPoint:'Vanilla bed / anchor / spawn']])}<div class="cm-actions">${button('Set first arrival…','arrival-setup',false,!editAllowed())}${s.arrival?button('Disable first arrival','arrival-disable',false,!editAllowed()):''}${button('Set after-death destination…','respawn-setup',false,!editAllowed())}${s.respawn?button('Use vanilla respawn','respawn-disable',false,!editAllowed()):''}</div>${reason()}<p class="cm-note">Independent settings. Saving a destination moves nobody now and preserves vanilla bed/anchor settings.</p>${button('Arrival history…','arrival-history')}`;
  }
  function detail() {
   if(s.section==='Events') return eventDetail();
   if(s.section==='Session') {
    if(s.item==='activity') return `<h2>Activity</h2>${sub(['Session','Events','Player moves','Loot fills'])}<p>No new actions in this example session.</p><p class="cm-note">Each record names its service, actor, session and result. Private game data stays private.</p>${command('/chronicle session history 20')}`;
    if(s.item==='recovery') return `<h2>Checks & recovery</h2>${kv([['Map references','One unassigned event audience'],['Pending world operations','None in this example'],['Backup / restore','Operator workspace tools']])}<div class="cm-actions">${button('Check again','check-setup')}${button('Inspect recovery example','recovery-example')}</div><p class="cm-note">A real unresolved action links to its handler. There is no blind retry or clear-error button.</p>${command('/chronicle session check')}`;
    return `<h2>Current session</h2>${kv([['Session','2 · '+s.phase.toLowerCase()],['World',s.phase==='ACTIVE'?'Simulation running':'Simulation frozen; players remain mobile'],['Active play','Example: 12 min 30 sec'],['Participating',((s.participant?1:0)+(s.guestParticipant?1:0))+' players'],['Editing',s.edit?'Enabled for your connection':'Off']])}<div class="cm-actions">${s.phase==='ACTIVE'?button('Pause session','pause',true):s.phase==='PAUSED'?button('Resume session','resume',true):button('Start session…','start',true)}${button('End session…','end',false,s.phase==='ENDED')}</div><p class="cm-note">Starting a new session refills managed loot chests. Resume does not refill them as a new session.</p>${command(s.phase==='PAUSED'?'/chronicle session resume':'/chronicle session pause')}`;
   }
   if(s.section==='Players') {
    const name=s.item==='guest'?'ExampleGuest':'SchinderRenge';
    const body=s.page==='Movement & respawn'?movement(name):s.page==='Character card'?`<p>This is the player's public character card. Secret roles are never stored here.</p>${kv([['Display name',name],['Public description','Example character card']])}${button(name==='SchinderRenge'?'Edit my card…':'Read character card','card')}`:`${kv([['Account',name],['Connection','Online'],['Participation',participating()?'Participating':'Not participating'],['Eligible now',s.edit&&s.item!=='guest'?'No: editing tools enabled':'Yes: online, alive, not spectating']])}<div class="cm-actions">${button(participating()?'Remove from session…':'Add to session','participation',true,!editAllowed())}</div>${reason()}<p class="cm-note">Participation affects the play clock and event audiences. Removing it does not kick the player or change spawn settings.</p>${s.item!=='guest'?button('Leave Chronicle…','leave'):''}`;
    return `<h2>${name}</h2>${sub(['Participation','Character card','Movement & respawn'])}${body}${command('/chronicle players inspect '+name)}`;
   }
   if(s.section==='Chests') {
    if(s.item==='loot') return `<h2>Loot types</h2><p>Mine cache · proposed in-game editor</p><p class="cm-note">Each item rolls independently; chances do not need to total 100%.</p><div class="cm-loot-row"><label>Item<select><option>Bread</option><option>Coal</option></select></label><label>Chance %<input data-field="lootChance" type="number" min="0" max="100" value="${s.lootChance}"></label><label>Count<input type="text" value="2–5" aria-label="Loot count range"></label></div><label>Refill<select><option>At the start of each new session</option><option>Also every X active minutes</option></select></label><p class="cm-reason">Scheduled refills replace ALL contents of bound loot chests.</p><div class="cm-actions">${button('Save loot type…','save-loot',true,!editAllowed())}${button('Reload loot configuration','reload-loot',false,!editAllowed())}</div>${reason()}${command('/chronicle chests loot inspect quiet_below:mine_cache')}`;
    return `<h2>${escape(s.chests[Number((s.item||'chest0').replace('chest',''))]||'Mine cache')}</h2>${kv([['Loot type','Mine cache'],['Container','Chest · overworld'],['Fill rule','New session; replace all contents'],['Contents now','Not changed by binding or inspection']])}<div class="cm-actions">${button('Show chest','show')}${button('Change loot type…','change-loot',false,!editAllowed())}${button('Unbind chest…','unbind',false,!editAllowed())}</div>${reason()}${command('/chronicle chests show mine_cache')}`;
   }
   if(s.section==='Regions') return `<h2>${escape(s.regions[Number((s.item||'region0').replace('region',''))]||'Saved region')}</h2>${kv([['Type','Region · two corners'],['Dimension','Overworld'],['Used by',eventStates.city.region===s.regions[Number((s.item||'region0').replace('region',''))]?'City vibration audience':'No active assignment in this example']])}<div class="cm-actions">${button('Show region','show')}${button('Edit bounds…','edit-region',false,!editAllowed())}${button('Delete region…','delete',false,!editAllowed())}</div>${reason()}<p class="cm-note">Saving an area changes no blocks and activates no game behavior.</p>${command('/chronicle regions inspect mine_entrance')}`;
   if(s.section==='Locations') {
    const block=(s.item||'point0').startsWith('block'); const label=(block?s.blocks:s.points)[Number((s.item||'point0').replace(/point|block/,''))]||'Saved location';
    return `<h2>${escape(label)}</h2>${kv([['Type',block?'Block site · expected block type':'Point · position and facing'],['Dimension','Overworld'],['Used for',block?'Game setup can assign this to a station':'Player moves, arrival or respawn destinations']])}<div class="cm-actions">${button(block?'Show block site':'Show location','show')}${button(block?'Replace block site…':'Update to my position…','update-location',false,!editAllowed())}${button('Delete location…','delete',false,!editAllowed())}</div>${reason()}<p class="cm-note">A block site is not a player spawn. Saving a point moves nobody.</p>${command('/chronicle locations inspect '+(block?'ancient_forge':'village_arrival'))}`;
   }
   if(s.item==='future') return `<h2>Planned tools</h2><p class="cm-planned">Design reference · not installed game functionality</p>${planned.map(([name,home,description])=>`<details><summary>${name}</summary><p><strong>${home}</strong></p><p class="cm-note">${description}</p></details>`).join('')}`;
   return `<h2>The Quiet Below · map setup</h2><p>Match each registered requirement to existing map geometry.</p>${kv([['Source city · REGION',s.assigned||'Unassigned'],['Relic Heart · BLOCK SITE','Unassigned'],['Ancient Forge · BLOCK SITE','Ancient forge'],['Arrival · POINT','Village arrival']])}<div class="cm-actions">${button('Assign source city…','assign',true,!editAllowed())}${button('Show assigned site','show',false,!s.assigned)}${button('Check setup','check-setup')}</div>${reason()}<p class="cm-note">Assign key sites here. Saving an assignment enables no growth or events.</p>${command('/chronicle setup assign quiet_below:source_city source_city_boundary')}`;
  }
  function render() {
   if(s.closed) {mount.innerHTML=`<div class="cm-app"><div class="cm-closed"><h2>Menu closed</h2><p>Saved example state and temporary selection are retained here.</p>${button('Reopen menu','reopen')}</div></div>`; bind(); return;}
   mount.innerHTML=`<div class="cm-app" data-view="${s.view}"><header class="cm-header"><strong class="cm-brand">Chronicle</strong><span class="cm-state">Session 2 · ${s.phase.toLowerCase()}</span><span>Editing: ${s.edit?'on':'off'}</span>${button(s.edit?'Disable editing':'Enable editing','edit',false,s.phase==='ACTIVE')}</header><div class="cm-columns"><nav class="cm-nav" aria-label="Chronicle sections">${nav.map((n,i)=>(i===3?'<div class="cm-group">ADVANCED<br>CONFIGURATION</div>':'')+`<button type="button" data-nav="${n}" ${s.section===n?'aria-current="page"':''}>${n}</button>`).join('')}</nav><section class="cm-list" aria-label="${s.section} items"><h2>${s.section}</h2>${items()}</section><section class="cm-detail" aria-label="Selected ${s.section} details">${button('← Back to list','back').replace('<button','<button class="cm-back"')}${detail()}</section></div><footer class="cm-footer"><span class="cm-feedback" aria-live="polite">${escape(s.feedback)}</span>${button('Close menu','close')}</footer>${s.modal?`<div class="cm-modal-shade"><section class="cm-modal" role="dialog" aria-modal="true" aria-label="${escape(s.modal.title)}"><h2>${escape(s.modal.title)}</h2>${s.modal.body}<div class="cm-actions">${button('Cancel','cancel')}${s.modal.confirm?button(s.modal.confirm,'confirm',true):button('Done','cancel',true)}</div></section></div>`:''}</div>`;
   bind();
  }
  function modal(title,body,confirm='',run=()=>{}) {s.modal={title,body,confirm,run};render();const modalBox=mount.querySelector('.cm-modal');(modalBox.querySelector('input,select')||modalBox.querySelector('button')).focus();}
  function chooseRegion() {
   modal('Choose audience region',`<p>Participants inside this saved region will receive the event.</p><label>Saved region<select data-modal="region">${s.regions.map(r=>`<option>${escape(r)}</option>`).join('')}</select></label>`,'Use this region',()=>{s.region=mount.querySelector('[data-modal="region"]').value;s.feedback='Audience region saved in the example. No event was run.';});
  }
  function action(a) {
   if(a==='cancel'){s.modal=null;render();return;}
   if(a==='confirm'){const m=s.modal;const result=m.run();if(result!==false&&s.modal===m)s.modal=null;render();persist();return;}
   if(a==='close'){s.closed=true;render();return;}
   if(a==='reopen'){s.closed=false;render();return;}
   if(a==='back'){s.view='list';render();return;}
   if(a==='edit'){s.edit=!s.edit;s.feedback=s.edit?'Editing enabled for this connection. Starting play or disconnecting clears it.':'Editing disabled. Saved definitions remain unchanged.';}
   else if(a==='pause'){s.phase='PAUSED';s.feedback='Session paused. World simulation and the active-play clock are frozen.';}
   else if(a==='resume'){s.phase='ACTIVE';s.edit=false;s.feedback='Session resumed. Editing was disabled by the server.';}
   else if(a==='start'||a==='end'){
    const start=a==='start';modal(start?'Start a new session?':'End this session?',`<p>${start?'Managed loot chests will refill and replace their contents.':'Game activity stops. Players stay mobile; the world is frozen.'}</p>`,start?'Start session':'End session',()=>{s.phase=start?'ACTIVE':'ENDED';s.edit=false;s.feedback=start?'New example session started. Editing is off.':'Example session ended.';});return;
   }
   else if(a==='preview-event'){
    const e=event();modal('Preview · '+e.name,`<p class="cm-kicker">Content preview · no game state or completion changes</p><div class="cm-quote">${escape(e.text)}</div>${e.sound?`<p>Sound: ${e.sound}</p>${button('Hear sample — only me','sample')}`:'<p>No sound. This is a game-state action.</p>'}<p class="cm-note">You can inspect this content before choosing a region or starting play.</p>`);return;
   }
   else if(a==='sample'){s.feedback='Sound sample would be sent only to SchinderRenge in-game. This design preview emits no audio or event.';s.modal=null;}
   else if(a==='check-event'){
    const e=event();modal('Live check · '+e.name,kv([['Session',s.phase],['Audience',e.type==='Game action'?'Not applicable: game state':e.local?(s.region?'Participating players in '+s.region:'Blocked: choose audience region'):'All participating players'],['Completion',s.complete?'Already completed':'Not yet run'],['Result',s.phase!=='ACTIVE'?'Blocked: start or resume session':e.local&&!s.region?'Blocked: no audience region':'Ready for a final reviewed run']])+`<p class="cm-note">This check sends nothing and changes no flags.</p>`);return;
   }
   else if(a==='run-event'){
    const e=event();modal('Run '+e.name+'?',`<p>${e.type==='Game action'?'Updates its declared game condition.':'Sends this public cue once to '+(e.local?'eligible participants in '+escape(s.region):'all participating players')+'.'}</p><div class="cm-quote">${escape(e.text)}</div><p>Manual and automatic delivery share the same completion record.</p>`,'Run '+e.name,()=>{s.complete=true;s.feedback='Example event completed. It will not automatically repeat without an explicit reset.';});return;
   }
   else if(a==='pick-region'){chooseRegion();return;}
   else if(a==='save-trigger'){
    if(s.trigger==='On entering a region'&&!s.region){s.feedback='Choose an entry region before saving.';}
    else if(s.trigger==='After active play time'&&(!Number.isInteger(Number(s.delay))||Number(s.delay)<1||Number(s.delay)>604800)){s.feedback='Enter 1 to 604800 seconds of active play.';}
    else if(s.trigger==='When a condition is true'&&s.flag==='None'){s.feedback='Choose the required game condition.';}
    else s.feedback='Trigger saved in the example. Saving setup does not run the event or clear history.';
   }
   else if(a==='save-requirements'){s.feedback='Requirements saved in the example. No cue was sent.';}
   else if(a==='disable-trigger'||a==='reset-event'){
    const reset=a==='reset-event';modal(reset?'Allow this event again?':'Disable automatic trigger?',`<p>${reset?'Clears current completion and restarts the active timer delay. The event can run again.':'Stops automatic delivery; keeps history and preserves deliberate manual control.'}</p>`,reset?'Allow another run':'Disable automatic trigger',()=>{if(reset)s.complete=false;else s.trigger='Manual';s.feedback=reset?'Completion reset in the example. No event was run now.':'Automatic trigger disabled in the example.';});return;
   }
   else if(a==='participation'||a==='leave'){
    const leave=a==='leave';modal(leave?'Leave Chronicle?':participating()?'Remove participation?':'Add to session?',`<p>${leave?'Removes your participation and automatic movement settings. You stay on the server and are not moved.':'Changes participation only; automatic spawn settings, character card and server access stay unchanged.'}</p>`,leave?'Leave Chronicle':participating()?'Remove participation':'Add to session',()=>{if(s.item==='guest')s.guestParticipant=!s.guestParticipant;else s.participant=leave?false:!s.participant;if(leave){s.arrival=false;s.respawn=false;}s.feedback='Example participation saved.';});return;
   }
   else if(a==='move-player'){
    modal('Move selected player',`<label>Destination point<select data-modal="point">${s.points.map(p=>`<option>${p}</option>`).join('')}</select></label><p>In game: loaded destination, standing room, hazards and facing are checked before final confirmation.</p>`,'Review move',()=>{const point=mount.querySelector('[data-modal="point"]').value;modal('Review player move',`<p>Player: ${s.item==='guest'?'ExampleGuest':'SchinderRenge'}</p><p>Destination: ${point}</p><p>One manual move. Does not change beds, anchors or automatic settings.</p>`,'Move player',()=>{s.feedback='Example manual move confirmed. No real player was moved.';});});return;
   }
   else if(a==='arrival-setup'||a==='respawn-setup'){
    const arrival=a==='arrival-setup';const name=s.item==='guest'?'ExampleGuest':'SchinderRenge';
    modal(arrival?'Set first arrival for '+name:'Set after-death destination for '+name,`<label>Saved point<select data-modal="destination">${s.points.map(p=>`<option>${escape(p)}</option>`).join('')}</select></label><p>${arrival?'One arrival attempt on the next eligible join or session start. Previous arrival history is retained.':'Applies after a real death during ACTIVE. Unsafe or unavailable destinations retain the vanilla result.'}</p><p>This saves a setting. It does not move the player now.</p>`,arrival?'Enable first arrival':'Set death destination',()=>{const point=mount.querySelector('[data-modal="destination"]').value;if(arrival){s.arrival=true;s.arrivalPoint=point;}else{s.respawn=true;s.respawnPoint=point;}s.feedback='Example destination saved for '+name+'. No player moved.';});return;
   }
   else if(a==='arrival-disable'||a==='respawn-disable'){
    if(a==='arrival-disable')s.arrival=false;else s.respawn=false;s.feedback='Example automatic movement setting disabled. History and vanilla respawn settings are retained.';
   }
   else if(a==='arrival-history'){modal('Arrival history',`<p>Not attempted in this example.</p><p>“Allow another arrival attempt” would explicitly clear the once-only claim. The next eligible join or session start could move this player.</p>`);return;}
   else if(a==='card'){const own=s.item!=='guest';modal('Public character card',own?`<label>Character name<input value="SchinderRenge"></label><p>Secret character roles are not part of this public card.</p>`:kv([['Character name','ExampleGuest'],['Public description','Example public character card'],['Editing','Only the owner may save this card']]),own?'Save my card':'',()=>{s.feedback='Example public card saved.';});return;}
   else if(a==='condition'){modal('Change game condition',`<p>Review the named condition and affected events.</p><label>Readiness checked<select><option>True</option><option>False</option></select></label>`,'Set condition',()=>{s.feedback='Example condition changed. A real handler revalidates the live phase and audit.';});return;}
   else if(a==='show'){s.feedback='Private in-world outline requested in this example. No teleport, contents change or activation.';}
   else if(a==='check-setup'){s.feedback='Example check: map assignments and references inspected. No changes or growth enabled.';}
   else if(a==='recovery-example'){modal('Recovery example · uncertain chest fill',`<p>A real handler compares the current inventory with recorded before/after contents.</p><p>Exact known state can be reconciled; conflicts remain blocked for inspection. No blind overwrite or replay.</p>`);return;}
   else if(a==='assign'){
    modal('Assign Source city',`<p>Requirement type: REGION. Points and block sites are not valid here.</p><label>Saved region<select data-modal="setup-region">${s.regions.map(r=>`<option>${r}</option>`).join('')}</select></label>`,'Assign region',()=>{s.assigned=mount.querySelector('[data-modal="setup-region"]').value;s.feedback='Example assignment saved. This does not activate ecology or events.';});return;
   }
   else if(['add-region','edit-region'].includes(a)){
    modal(a==='add-region'?'Create region':'Edit region bounds',`<p>Two corners in the same world. Use the map to choose them.</p>${button('First corner: my feet','corner1')}${button('Second corner: looked block','corner2')}<p data-corners>Selected: ${s.corners}/2 corners</p><label>Region name<input data-modal="name" value="Mine entrance extension"></label><p>Closing to walk keeps the temporary selection. Saving changes no blocks.</p>`,'Save region',()=>{if(s.corners<2){s.modal.body+='<p role="alert" class="cm-reason">Choose both corners before saving.</p>';return false;}s.regions.push(mount.querySelector('[data-modal="name"]').value||'New region');s.feedback='Example region saved with a stable ID and separate display name.';});return;
   }
   else if(a==='corner1'||a==='corner2'){s.corners=Math.min(2,s.corners+1);const label=mount.querySelector('[data-corners]');if(label)label.textContent='Selected: '+s.corners+'/2 corners';return;}
   else if(a==='add-point'||a==='add-block'){
    const point=a==='add-point';modal(point?'Save my position':'Bind looked-at block',`<p>${point?'Saves a precise point with facing. No player is moved.':'Saves this exact block site and expected type. It is not a spawn point.'}</p><label>Name<input data-modal="name" value="${point?'Town square':'Relic Heart site'}"></label>`,'Save location',()=>{(point?s.points:s.blocks).push(mount.querySelector('[data-modal="name"]').value||'New location');s.feedback='Example location saved. No behavior enabled.';});return;
   }
   else if(a==='add-chest'||a==='change-loot'){
    modal(a==='add-chest'?'Bind looked-at chest':'Change chest loot type',`<p>Target is locked to the looked-at container before confirming.</p><label>Loot type<select><option>Mine cache</option><option>Settlement supplies</option><option>Ancient cache</option></select></label><p class="cm-reason">Scheduled fills replace all contents. Binding does not fill it now.</p>`,'Save chest binding',()=>{if(a==='add-chest')s.chests.push('New bound chest');s.feedback='Example chest binding saved. Contents and fill history were not changed.';});return;
   }
   else if(['delete','unbind','update-location','save-loot'].includes(a)){
    const label=a==='save-loot'?'Save loot type':a==='update-location'?'Update location':a==='unbind'?'Unbind chest':s.section==='Regions'?'Delete region':'Delete location';
    modal(label+'?',`<p>${a==='save-loot'?'Entries roll independently. Future scheduled fills replace all managed contents.':'Inspect every referenced event, player destination and map requirement before confirming. Stale consumers will not silently follow moved geometry.'}</p>`,label,()=>{s.feedback='Reviewed example change acknowledged. This mockup does not modify a world.';});return;
   }
   else if(a==='reload-loot'){s.feedback='Example candidate configuration validated and reloaded. No receipt reset or loot reroll.';}
   render();persist();
  }
  function bind() {
   mount.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.act)));
   mount.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{saveContext();remembered[s.section]={item:s.item,page:s.page};s.section=el.dataset.nav;const previous=remembered[s.section];s.item=previous?.item||{Session:'current',Players:'self',Events:'city',Chests:'chest0',Regions:'region0',Locations:'point0','Game setup':'requirements'}[s.section];loadContext();s.page=previous?.page||'Overview';s.view='list';s.modal=null;render();persist();}));
   mount.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('click',()=>{saveContext();s.item=el.dataset.item;loadContext();s.page='Overview';s.view='detail';render();persist();}));
   mount.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{s.page=el.dataset.page;render();persist();}));
   mount.querySelectorAll('[data-field]').forEach(el=>{
    if(el.tagName==='INPUT'&&el.type!=='checkbox') {
     el.addEventListener('input',()=>{s[el.dataset.field]=el.value;});
     el.addEventListener('change',persist);
    } else el.addEventListener('change',()=>{s[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;render();persist();});
   });
  }
  mount.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render();}else if(e.key==='Escape'&&!s.closed){s.closed=true;render();}});
  render();
  window.addEventListener('openai:set_globals',e=>{const restored=e.detail?.globals?.widgetState?.privateContent?.menus?.[index];if(restored&&nav.includes(restored.section)&&(restored.section!==s.section||restored.item!==s.item||(restored.page||'Overview')!==s.page)){saveContext();s.section=restored.section;s.item=restored.item||'';loadContext();s.page=restored.page||'Overview';render();}});
  if(globalThis.Tweak){const settings={spacing:14};const tweak=new Tweak({container:mount,onChange:()=>mount.style.setProperty('--cm-review-spacing',settings.spacing+'px')});tweak.addSlider(settings,'spacing',{label:'Panel spacing',min:10,max:20,step:2,unit:'px'});}
 });
})();
</script>
