<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Last Council — Banquet design review</title><style>
:root{font:15px Consolas,'Courier New',monospace;color:#eee;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#161c1b}button,input,select{font:inherit}button{padding:7px 10px;min-height:36px;border:2px solid #181818;border-left-color:#bebebe;border-top-color:#bebebe;color:white;background:#737373;cursor:pointer}button:disabled{background:#434343;color:#aaa;cursor:not-allowed}button.selected{border-color:#e9d39b;background:#675e43}button.primary{background:#58654c}input,select{background:#141414;border:2px solid #888;padding:7px;color:white;max-width:100%}input[type=number]{width:90px}label{display:block;margin:10px 0}h1,h2,p{margin:0 0 10px}h1{font-size:19px;color:#e9d39b;font-weight:normal}h2{font-size:15px;color:#e9d39b;font-weight:normal}p{line-height:1.4}.review,.foot{max-width:1000px;margin:0 auto 12px;font-size:12px;color:#bab8ad}.review label{display:inline-flex;gap:5px;align-items:center;margin:5px 10px 5px 0}.world{max-width:1000px;margin:auto;min-height:570px;background:linear-gradient(#212824,#111715);border:2px solid #333a32;padding:24px 18px;display:flex;align-items:center;flex-direction:column}.entry{font-size:12px;color:#c6c1a4}.screen{width:min(700px,100%);height:min(480px,75vh);display:flex;flex-direction:column;padding:16px;background:#333;border:3px solid #141414;outline:2px solid #aaa}.bar{display:flex;align-items:center;gap:8px;border-bottom:2px solid #171717;padding-bottom:10px;margin-bottom:10px}.bar h1{flex:1;margin:0}.split{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;overflow:auto;flex:1;min-height:0}.list button{display:block;text-align:left;width:100%;margin:0 0 6px}.card{padding:10px;background:#3c3c3c;border:2px solid #232323;margin-bottom:8px}.muted{color:#bab8ad;font-size:12px}.warning{border-left:3px solid #d3a865;padding:8px;background:#413b30}.error{color:#ffb9ad}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.status{min-height:25px;color:#e6dcba;padding:8px 0}.footer{border-top:2px solid #171717;padding-top:8px;margin-top:8px}.compact .screen{width:min(550px,100%);height:min(360px,70vh)}dialog{width:min(520px,94vw);max-height:85vh;overflow:auto;background:#373737;color:#eee;border:3px solid #111;outline:2px solid #aaa;padding:16px}dialog::backdrop{background:#000b}.foot{margin-top:14px;line-height:1.5}a{color:#e1d1a2}@media(max-width:600px){body{padding:8px}.world{padding:14px 8px}.split{grid-template-columns:1fr}.list{display:flex;gap:6px}.list button{width:auto;flex:1}.screen{height:min(520px,75vh)}}
</style></head><body>
<aside class="review"><strong>Review simulation — outside the game screen</strong><p>Proposed policies and sample data; nothing is saved to a game.</p><label><input id="op" type="checkbox" checked> OP</label><label><input id="editing" type="checkbox" checked> Editing</label><label><input id="active" type="checkbox"> Active play</label><label><input id="chancellor" type="checkbox"> Assigned Chancellor</label><label><input id="online" type="checkbox" checked> Participant online</label><label><input id="failure" type="checkbox"> Simulate delivery failure</label><label><input id="compact" type="checkbox"> Compact frame</label><button id="reset">Reset example</button></aside>
<div class="world" id="world"><p class="entry" id="path"></p><main class="screen" id="screen" aria-label="Banquet"></main></div><dialog id="popup" aria-labelledby="popup-title"></dialog><p class="foot">Interactive proposal only. Approved workflow illustration; native delivery and verification are documented with LC07.</p>
<script>
'use strict';
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{let x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}, btn=(text,fn,disabled=false,cls='')=>{let x=el('button',text,cls);x.type='button';x.onclick=fn;x.disabled=disabled;return x}, actions=(...xs)=>{let x=el('div',undefined,'actions');x.append(...xs);return x};
let state,view='setup',notice='';function reset(){state={enabled:false,onset:2,duration:8};view='setup';notice='';for(const id of ['op','editing','online'])$(id).checked=true;for(const id of ['active','chancellor','failure','compact'])$(id).checked=false;render()}
function canEdit(){return $('op').checked&&$('editing').checked&&!$('active').checked}function reason(){return !$('op').checked?'Operator access is required.':!$('editing').checked?'Enable Editing to change settings.':$('active').checked?'Settings cannot be changed during active play.':''}function card(title,body){let x=el('section',undefined,'card');x.append(el('h2',title),el('p',body));return x}
function render(){ $('world').classList.toggle('compact',$('compact').checked);$('path').textContent=view==='setup'?'Advanced → Game setup → Banquet':'Chancellor → Private moderation log';let s=$('screen');s.replaceChildren();let bar=el('header',undefined,'bar');bar.append(el('h1',view==='setup'?'Game setup':'Private moderation log'),btn('Close',()=>{notice='This would close the screen.';render()}));s.append(bar);let split=el('div',undefined,'split'),list=el('nav',undefined,'list'),detail=el('div');if(view==='setup'){list.append(btn('Banquet',()=>{},false,'selected'));if(!$('op').checked){detail.append(el('p','Operator access is required for Game setup.','warning'))}else{detail.append(card('Banquet',state.enabled?'Poisoning enabled':'Poisoning disabled'),card('Proposed policy',`Onset: ${state.onset} active minutes · Illness: ${state.duration} active minutes\nNausea I and Slowness I; no direct damage.`),el('p','Drinks can be used at full hunger. This optional feature does not affect Council setup.','muted'));if(reason())detail.append(el('p',reason(),'warning'));detail.append(actions(btn('Edit settings…',settings,!canEdit()),btn('Give supplies…',gift,!$('op').checked)))} }else{list.append(btn('Banquet events',()=>{},false,'selected'));if(!$('chancellor').checked)detail.append(el('p','Only the assigned Chancellor can view this private log.','warning'));else detail.append(el('p','Private moderation information. Do not share through public history.','warning'),card('Example · active play 12:03','Rowan contaminated a drink.'),card('Example · active play 12:09','A drink was consumed by Vale.'))}split.append(list,detail);s.append(split);let foot=el('div',undefined,'footer');foot.append(actions(btn(view==='setup'?'Open Chancellor log…':'Back to Game setup',()=>{view=view==='setup'?'log':'setup';notice='';render()})));let status=el('div',notice,'status');status.setAttribute('role','status');foot.append(status);s.append(foot)}
function popup(title){let d=$('popup');d.replaceChildren();let h=el('h1',title);h.id='popup-title';d.append(h);d.showModal();return d}function close(){ $('popup').close() }function field(d,label,value){let l=el('label',label+' '),i=el('input');i.type='number';i.min='1';i.max='60';i.value=value;l.append(i);d.append(l);return i}
function settings(){let d=popup('Banquet settings'),l=el('label'),enabled=el('input');enabled.type='checkbox';enabled.checked=state.enabled;l.append(enabled,document.createTextNode(' Enable poisoning'));d.append(l,el('p','Proposed values for review','muted'));let onset=field(d,'Onset (active minutes, 1–60)',state.onset),duration=field(d,'Illness (active minutes, 1–60)',state.duration);d.append(el('p','Proposed fixed policy: Nausea I and Slowness I; no direct damage. Illness persists through death and reconnect; its clock pauses offline. Antidote fully cures; further doses refresh illness.','card'));let error=el('p','','error');error.setAttribute('role','alert');d.append(error,actions(btn('Cancel',close),btn('Save',()=>{if(!canEdit()){error.textContent=reason();return}let values=[onset,duration].map(x=>Number(x.value));if([onset,duration].some(x=>!x.value.trim())||values.some(x=>!Number.isInteger(x)||x<1||x>60)){error.textContent='Enter whole minutes from 1 to 60.';return}state={enabled:enabled.checked,onset:values[0],duration:values[1]};close();notice='Settings saved in this sample.';render()},false,'primary')))}
function gift(){let d=popup('Give banquet supplies'),l=el('label','Online participant '),select=el('select');select.append(new Option('Select participant',''),new Option('Rowan','rowan'));l.append(select);d.append(l,el('p','A single bounded gift to the selected online participant.','muted'));let drink=field(d,'Drinks (0–16)',0),dose=field(d,'Poison doses (0–16)',0),antidote=field(d,'Antidotes (0–16)',0);[drink,dose,antidote].forEach(x=>{x.min='0';x.max='16'});let error=el('p','','error');error.setAttribute('role','alert');d.append(error,actions(btn('Cancel',close),btn('Review…',()=>{if(!$('op').checked){error.textContent='Operator access is required.';return}if(!select.value||!$('online').checked){error.textContent='Select a participant who is online.';return}let inputs=[drink,dose,antidote],values=inputs.map(x=>Number(x.value));if(inputs.some(x=>!x.value.trim())||values.some(x=>!Number.isInteger(x)||x<0||x>16)||values.every(x=>x===0)){error.textContent='Enter whole quantities from 0 to 16 and choose at least one item.';return}confirmGift(values)},false,'primary')))}
function confirmGift(values){let d=$('popup');d.replaceChildren();let h=el('h1','Confirm supplies');h.id='popup-title';d.append(h,el('p',`Give Rowan ${values[0]} drinks, ${values[1]} poison doses and ${values[2]} antidotes?`),el('p','The recipient must remain online and have inventory space.','muted'));let error=el('p','','error');error.setAttribute('role','alert');d.append(error,actions(btn('Cancel',close),btn('Confirm gift',()=>{if(!$('op').checked){error.textContent='Operator access is required.';return}if(!$('online').checked){error.textContent='The participant is no longer online. No gift was sent.';return}if($('failure').checked){error.textContent='Delivery failed. No gift was sent; check inventory space and retry.';return}close();notice='Sample gift delivered to Rowan.';render()},false,'primary')))}
for(const id of ['op','editing','active','chancellor','online','failure','compact'])$(id).onchange=render;$('reset').onclick=reset;reset();
</script></body></html>
