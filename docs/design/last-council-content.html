<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Last Council — source catalogue design</title><style>
:root{font:15px Consolas,'Courier New',monospace;color:#eee;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#161c1b}button,input,textarea,select{font:inherit}button{padding:8px 12px;min-height:37px;border:2px solid #181818;border-left-color:#bebebe;border-top-color:#bebebe;color:white;background:#737373;cursor:pointer}button:disabled{background:#434343;color:#aaa;cursor:not-allowed}button.selected{border-color:#e9d39b;background:#675e43}button.primary{background:#58654c}input,textarea,select{background:#141414;border:2px solid #888;padding:8px;color:white;max-width:100%}input:not([type=checkbox]),textarea{width:100%}textarea{min-height:74px;resize:vertical}label{display:grid;gap:6px;margin:10px 0}h1,h2,p{margin:0 0 12px}h1{font-size:20px;color:#e9d39b;font-weight:normal}h2{font-size:15px;font-weight:normal;color:#e9d39b}p{line-height:1.5}.review,.foot{max-width:1000px;margin:0 auto 12px;font-size:12px;color:#bab8ad}.review label{display:inline-flex;gap:6px;align-items:center;margin:5px 12px 5px 0}.world{max-width:1000px;margin:auto;min-height:600px;background:linear-gradient(#212824,#111715);border:2px solid #333a32;padding:24px 18px;display:flex;align-items:center;flex-direction:column}.entry{font-size:12px;color:#c6c1a4}.screen{width:min(700px,100%);padding:20px;background:#333;border:3px solid #141414;outline:2px solid #aaa;max-height:75vh;overflow:auto}.bar{display:flex;align-items:center;gap:8px;border-bottom:2px solid #171717;padding-bottom:12px;margin-bottom:14px}.bar h1{flex:1;margin:0}.tabs,.actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{flex:1;min-width:110px}.split{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px}.list{max-height:400px;overflow:auto}.list button{display:block;text-align:left;width:100%;margin:6px 0}.card{padding:12px;background:#3c3c3c;border:2px solid #232323;margin-bottom:8px}.card p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.muted{color:#bab8ad;font-size:12px}.warning{border-left:3px solid #d3a865;padding:9px;background:#413b30}.error{color:#ffb9ad}.status{min-height:30px;color:#e6dcba;padding:12px}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}.scopes label{display:flex;align-items:center;gap:8px}.fact{border-bottom:1px solid #777;padding-bottom:8px}dialog{width:min(560px,95vw);max-height:88vh;overflow:auto;background:#373737;color:#eee;border:3px solid #111;outline:2px solid #aaa;padding:20px}dialog::backdrop{background:#000b}.foot{margin-top:14px;line-height:1.5}a{color:#e1d1a2}@media(max-width:650px){body{padding:10px}.world{padding:15px 10px}.screen{padding:15px}.split{grid-template-columns:1fr}.list{max-height:180px;border-bottom:1px solid #777}.tabs button{min-width:95px}}
</style></head><body>
<aside class="review"><strong>Review simulation — outside the game screen</strong><p>These switches simulate access and lifecycle conditions. Sample definitions only.</p><label><input type="checkbox" id="op" checked> OP</label><label><input type="checkbox" id="editing" checked> Editing</label><label><input type="checkbox" id="active"> Active play</label><label><input type="checkbox" id="pending"> Unresolved operation</label><label><input type="checkbox" id="cast"> Cast committed</label><button id="reset">Reset example</button></aside>
<div class="world"><p class="entry">Advanced → Game setup → Source catalogue</p><main id="screen" class="screen" aria-label="Source catalogue"></main><div id="status" class="status" role="status" aria-live="polite"></div></div><dialog id="editor" aria-labelledby="editor-title"></dialog><dialog id="picker" aria-labelledby="picker-title"></dialog><p class="foot">Design only: no game data, players, draw or seed. Cast locking is a proposal for review. <a href="../work-packages/last-council/LC01_CONTENT_UI_DESIGN.md">Interaction notes</a></p>
<script>
'use strict';
const $=id=>document.getElementById(id), n=(tag,text,cls)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}, button=(label,fn,disabled=false,cls='')=>{let b=n('button',label,cls);b.type='button';b.disabled=disabled;b.onclick=fn;return b}, E=(...nodes)=>{let e=n('div',undefined,'actions');e.append(...nodes);return e};
let state,category='houses',selected='',query='';
const categories={houses:'Houses',secrets:'Secrets',goals:'House goals',rules:'Knowledge rules'};
function reset(){state={houses:[{id:'last_council:ash',title:'House Ash',reputation:'Stewards of the north',description:'Its roads carry wool and iron.',interests:'Protect northern trade.',candidate:true},{id:'last_council:vale',title:'House Vale',reputation:'Grain merchants',description:'Known for wheat exports.',interests:'Secure river access.',candidate:true}],secrets:[{id:'wheat-capacity',weight:1,text:'${house.title} can supply ${fact.capacity} other houses.',facts:{'fact.capacity':'three'},scope:['last_council:vale']}],goals:[{id:'river-access',weight:1,text:'Seek lasting river access for ${house.title}.',scope:['last_council:ash','last_council:vale']}],rules:{secrets:1,goals:1,chance:25}};category='houses';selected=state.houses[0].id;query='';for(let id of ['op','editing'])$(id).checked=true;for(let id of ['active','pending','cast'])$(id).checked=false;$('status').textContent='';render()}
function editable(){return $('op').checked&&$('editing').checked&&!$('active').checked&&!$('pending').checked&&!$('cast').checked}function reason(){if(!$('op').checked)return 'OP access is required to change source definitions.';if(!$('editing').checked)return 'Enable Editing to change source definitions.';if($('active').checked)return 'Source editing is unavailable during active play.';if($('pending').checked)return 'Resolve the pending operation before editing.';if($('cast').checked)return 'Proposed cast lock: committed cast keeps source definitions read-only.';return ''}function card(h,t){let e=n('section',undefined,'card');e.append(n('h2',h),n('p',t));return e}function current(){return category==='rules'?state.rules:state[category].find(x=>x.id===selected)}
function render(){let s=$('screen');s.replaceChildren();let bar=n('header',undefined,'bar');bar.append(n('h1','Source catalogue'),button('Close',()=>{$('status').textContent='In game, this closes the catalogue.'}));s.append(bar);if(!$('op').checked){s.append(n('p','Operator access is required to inspect source definitions.','warning'));return}let tabs=n('div',undefined,'tabs');Object.entries(categories).forEach(([key,label])=>tabs.append(button(label,()=>{category=key;selected=key==='rules'?'':state[key][0]?.id||'';query='';render()},false,key===category?'selected':'')));s.append(tabs);if(reason())s.append(n('p',reason(),'warning'));let layout=n('div',undefined,'split'),list=n('nav',undefined,'list'),detail=n('div');list.setAttribute('aria-label',categories[category]);
if(category==='rules'){list.append(button('Knowledge rules',()=>{},false,'selected'));let r=state.rules;detail.append(card('House content counts','Secrets per House: '+r.secrets+'\nHouse goals per House: '+r.goals),card('Other Houses’ knowledge','Per secret and per other House: '+r.chance+'%\nZero, one or multiple observers are possible.'));detail.append(E(button('Edit rules…',()=>ruleForm(),!editable())))}else{let add=category==='houses'?'Create House':category==='secrets'?'Create secret':'Create House goal';list.append(button('+ '+add,()=>form(),!editable(),'primary'));let search=n('label','Search'),input=n('input');input.value=query;input.oninput=()=>{query=input.value;drawList()};search.append(input);list.append(search);let rows=n('div');list.append(rows);function drawList(){rows.replaceChildren();let found=state[category].filter(x=>(x.id+' '+(x.title||x.text)).toLowerCase().includes(query.toLowerCase()));if(!found.length)rows.append(n('p','No matching definitions.','muted'));found.forEach(item=>rows.append(button(item.title||item.id,()=>{selected=item.id;render()},false,item.id===selected?'selected':'')))}drawList();let item=current();if(!item)detail.append(n('p','Select a definition or create one.','muted'));else{detail.append(card('Identifier',item.id));if(category==='houses'){detail.append(card('Reputation',item.reputation),card('Description',item.description),card('Interests',item.interests),card('Default candidate',item.candidate?'Yes':'No'))}else{detail.append(card('Template',item.text),card('Weight',String(item.weight)),card('Applicable Houses',item.scope.map(id=>state.houses.find(h=>h.id===id)?.title||id).join('\n')));if(category==='secrets')detail.append(card('Fact defaults',Object.entries(item.facts).map(([k,v])=>k+' = '+v).join('\n')||'No fact defaults.'));detail.append(E(button('Preview sample…',()=>preview(item))))}detail.append(E(button('Edit…',()=>form(item),!editable()),button('Delete…',()=>remove(item),!editable())))}}
layout.append(list,detail);s.append(layout);}
function guard(err){if(editable())return true;err.textContent=reason();return false}function field(parent,label,value,multi=false){let wrap=n('label',label),input=n(multi?'textarea':'input');input.value=value;wrap.append(input);parent.append(wrap);return input}function dialog(title){let d=$('editor');d.replaceChildren();let h=n('h1',title);h.id='editor-title';d.append(h);d.showModal();return d}function close(){ $('editor').close() }
function form(original){let kind=category,editing=!!original,existingId=original?.id, draft=original?structuredClone(original):kind==='houses'?{id:'',title:'',reputation:'',description:'',interests:'',candidate:true}:kind==='secrets'?{id:'',weight:1,text:'',facts:{},scope:[]}:{id:'',weight:1,text:'',scope:[]};let d=dialog((editing?'Edit ':'Create ')+categories[kind].replace(/s$/,''));let id=field(d,'Identifier',draft.id);if(editing)id.disabled=true;let inputs={};if(kind==='houses'){for(let key of ['title','reputation','description','interests'])inputs[key]=field(d,key[0].toUpperCase()+key.slice(1),draft[key],key==='description'||key==='interests');let l=n('label'),c=n('input');c.type='checkbox';c.checked=draft.candidate;l.append(c,document.createTextNode(' Default candidate'));d.append(l);inputs.candidate=c}else{inputs.weight=field(d,'Weight (1–1,000,000)',String(draft.weight));inputs.weight.type='number';inputs.text=field(d,'Literal template text',draft.text,true);let summary=n('p',''),scopeButton=button('Choose applicable Houses…',()=>scopePicker(draft,summary));function updateScope(){summary.textContent=draft.scope.length?draft.scope.map(id=>state.houses.find(h=>h.id===id)?.title||id).join(', '):'No Houses selected.'}updateScope();d.append(scopeButton,summary);if(kind==='secrets'){d.append(n('h2','Fact defaults'));let factBox=n('div');d.append(factBox);function addFact(key='',value=''){let row=n('div',undefined,'fact'),k=field(row,'Key',key),v=field(row,'Value',value);row.append(button('Remove fact',()=>row.remove()));factBox.append(row);return {k,v}}let facts=[];for(let [k,v] of Object.entries(draft.facts))facts.push(addFact(k,v));d.append(button('+ Add fact default',()=>facts.push(addFact())));inputs.facts={box:factBox,read:()=>[...factBox.children].map(row=>[row.querySelectorAll('input')[0].value,row.querySelectorAll('input')[1].value])}}}
let error=n('p','','error');d.append(error,E(button('Cancel',close),button('Save',()=>{if(!guard(error))return;if(editing&&!state[kind].some(x=>x.id===existingId)){error.textContent='This definition no longer exists. Reopen the catalogue.';return}let key=id.value.trim();if(!key){error.textContent='Enter an identifier.';return}if(!editing&&state[kind].some(x=>x.id===key)){error.textContent='That identifier already exists.';return}if(kind==='houses'){if(!/^[a-z0-9_.-]+:[a-z0-9_./-]+$/.test(key)||key.length>128||!inputs.title.value.trim()){error.textContent='Use a namespaced House ID and enter a title.';return}Object.assign(draft,{id:key,title:inputs.title.value.trim(),reputation:inputs.reputation.value,description:inputs.description.value,interests:inputs.interests.value,candidate:inputs.candidate.checked})}else{let weight=Number(inputs.weight.value);if(!Number.isInteger(weight)||weight<1||weight>1000000||!inputs.text.value.trim()||!draft.scope.length||draft.scope.some(x=>!state.houses.some(h=>h.id===x))){error.textContent='Enter text, a valid weight and at least one existing House.';return}Object.assign(draft,{id:key,weight,text:inputs.text.value});if(kind==='secrets'){let pairs=inputs.facts.read(),map={};for(let [k,v] of pairs){if(!/^fact\.[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*$/.test(k)||Object.hasOwn(map,k)){error.textContent='Fact keys must be unique and start with fact. followed by a valid name.';return}map[k]=v}draft.facts=map}}if(editing)state[kind][state[kind].findIndex(x=>x.id===existingId)]=draft;else state[kind].push(draft);selected=draft.id;close();$('status').textContent='Definition saved in this sample.';render()},false,'primary')))}
function scopePicker(draft,summary){let p=$('picker');p.replaceChildren();let h=n('h1','Choose applicable Houses');h.id='picker-title';let local=new Set(draft.scope),box=n('div',undefined,'scopes');state.houses.forEach(house=>{let l=n('label'),c=n('input');c.type='checkbox';c.checked=local.has(house.id);c.onchange=()=>c.checked?local.add(house.id):local.delete(house.id);l.append(c,document.createTextNode(house.title));box.append(l)});p.append(h,box,E(button('Cancel',()=>p.close()),button('Done',()=>{draft.scope=[...local];summary.textContent=draft.scope.map(id=>state.houses.find(h=>h.id===id)?.title||id).join(', ')||'No Houses selected.';p.close()})));p.showModal()}
function ruleForm(){let d=dialog('Edit knowledge rules'),a=field(d,'Secrets per House (0–4)',state.rules.secrets),b=field(d,'House goals per House (0–4)',state.rules.goals),c=field(d,'Knowledge chance per secret per other House (0–100%)',state.rules.chance);[a,b,c].forEach(x=>x.type='number');let error=n('p','','error');d.append(error,E(button('Cancel',close),button('Save',()=>{if(!guard(error))return;let values=[a,b,c].map(x=>Number(x.value));if([a,b,c].some(x=>x.value.trim()==='')||values.some((x,i)=>!Number.isInteger(x)||x<0||x>(i===2?100:4))){error.textContent='Enter whole numbers within the shown ranges.';return}state.rules={secrets:values[0],goals:values[1],chance:values[2]};close();render()},false,'primary')))}
function remove(item){let kind=category,d=dialog('Delete definition?'),error=n('p','','error');d.append(n('p',item.title||item.id),n('p','This changes reusable definitions in the sample.'),error,E(button('Cancel',close),button('Delete',()=>{if(!guard(error))return;if(!state[kind].some(x=>x.id===item.id)){error.textContent='This definition no longer exists.';return}if(kind==='houses'&&[...state.secrets,...state.goals].some(x=>x.scope.includes(item.id))){error.textContent='This House is referenced by a secret or goal. Remove its references first.';return}state[kind]=state[kind].filter(x=>x.id!==item.id);selected=state[kind][0]?.id||'';close();render()})))}
function preview(item){let d=dialog('Preview with sample bindings'),bindings=field(d,'Explicit sample bindings (JSON object)', '{"house.title":"House Vale","fact.capacity":"three"}',true),out=n('p','','card'),error=n('p','','error');d.append(n('p','Only the bindings entered here are used. No live assignment or draw is read.','muted'),error,out,E(button('Close',close),button('Render sample',()=>{try{let map=JSON.parse(bindings.value);if(!map||Array.isArray(map)||typeof map!=='object'||Object.values(map).some(v=>typeof v!=='string'))throw Error();let missing=[];out.textContent=item.text.replace(/\$\{([^}]+)\}/g,(m,key)=>Object.hasOwn(map,key)?map[key]:(missing.push(key),m));error.textContent=missing.length?'Missing sample bindings: '+[...new Set(missing)].join(', '):''}catch{error.textContent='Enter a JSON object with string values.';out.textContent=''}})))}
for(let id of ['op','editing','active','pending','cast'])$(id).onchange=render;$('reset').onclick=reset;reset();
</script></body></html>
