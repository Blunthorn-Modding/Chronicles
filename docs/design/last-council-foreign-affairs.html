<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foreign affairs review</title><style>
:root{font:15px Consolas,'Courier New',monospace;color:#eee;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#161c1b}button,input,textarea,select{font:inherit}button{padding:8px 12px;min-height:37px;border:2px solid #181818;border-left-color:#bebebe;border-top-color:#bebebe;color:#fff;background:#737373;cursor:pointer}button:disabled{background:#434343;color:#aaa;cursor:not-allowed}.selected{border-color:#e9d39b;background:#675e43}.primary{background:#58654c}input,textarea,select{background:#141414;border:2px solid #888;padding:8px;color:#fff;max-width:100%;min-width:0}textarea{width:100%;min-height:72px}label{display:grid;gap:6px;margin:10px 0}h1,h2,p{margin:0 0 12px}h1{font-size:21px;font-weight:normal;color:#e9d39b}h2{font-size:16px;font-weight:normal}p{line-height:1.45}.review{max-width:1000px;margin:0 auto 12px;font-size:12px}.review label{display:inline-flex;margin:4px 10px 4px 0}.world{max-width:1000px;margin:auto;min-height:500px;padding:24px 18px;background:linear-gradient(#212824,#111715);border:2px solid #333a32;display:flex;align-items:center;flex-direction:column}.screen{width:min(700px,100%);max-height:75vh;overflow:auto;padding:20px;background:#333;border:3px solid #141414;outline:2px solid #aaa}.bar{display:flex;align-items:center;gap:12px;border-bottom:2px solid #171717;padding-bottom:12px;margin-bottom:16px}.bar h1{flex:1;margin:0}.split{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}.list{max-height:320px;overflow:auto}.list button{display:block;text-align:left;width:100%;margin-bottom:8px}.list small{display:block;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button{flex:1;min-width:120px}.tag{color:#e9d39b;font-size:12px}.muted{color:#bab8ad}.record{white-space:pre-wrap;overflow-wrap:anywhere}.notice{min-height:35px;padding:14px;color:#e6dcba;font-size:13px}.shade{position:fixed;inset:0;background:#000b;padding:18px;display:grid;place-items:center}.popup{background:#373737;width:min(580px,100%);border:3px solid #111;outline:2px solid #aaa;padding:22px;max-height:88vh;overflow:auto}.foot{max-width:1000px;margin:14px auto;color:#bab8ad;font-size:12px}@media(max-width:650px){body{padding:10px}.world{padding:16px 10px}.screen{padding:15px}.split{grid-template-columns:1fr}.list{max-height:150px;border-bottom:1px solid #777;padding-bottom:8px}}
</style></head><body><aside class="review"><strong>Reviewer simulation · outside the game screen</strong><p>Fictional fixture; this is a workflow proposal, not implemented gameplay. Switch surfaces and actors to inspect the flow.</p><label>Actor <select id="actor"><option>House representative</option><option>Chancellor</option><option>Operator · Editing</option><option>Operator · Active</option></select></label><button data-scene="register">Public register</button> <button data-scene="editor">Game setup</button> <button data-scene="motions">Motion lectern</button> <button data-scene="proceedings">Proceedings</button> <label>Simulated ballot tally <select id="tally"><option value="6">6 of 8 yes</option><option value="5">5 of 8 yes</option></select></label> <button id="aba">Simulate intervening war then peace</button> <button id="reset">Reset fixture</button></aside><div class="world"><main class="screen" id="screen"></main><div class="notice" id="notice" role="status"></div></div><div id="overlay"></div><p class="foot">Illustrative realm: Northreach. Stale-handling is proposed for owner review; no simulation control is an in-game override.</p>
<script>
'use strict';
const $=s=>document.querySelector(s),el=(t,x,c)=>{let n=document.createElement(t);if(x!==undefined)n.textContent=x;if(c)n.className=c;return n},p=(x,c)=>el('p',x,c);let state,origin;
function reset(){state={scene:'register',filter:'Foreign affairs',selected:1,realm:1,motion:0,realms:[{id:1,name:'Northreach',description:'An illustrative neighbouring realm beyond the northern border.',status:'Not at war',revision:0,history:[]}],motions:[]};$('#actor').value='House representative';notice('');render()}
function notice(x){$('#notice').textContent=x}function actor(){return $('#actor').value}function button(x,fn,disabled=false,cls=''){let b=el('button',x,cls);b.type='button';b.disabled=disabled;b.onclick=fn;return b}function actions(...items){let d=el('div',undefined,'actions');d.append(...items);return d}function field(name,control){let l=el('label',name);l.append(control);return l}function select(values){let s=el('select');values.forEach(v=>s.append(el('option',v)));return s}function input(value=''){let x=el('input');x.value=value;return x}function textarea(value=''){let x=el('textarea');x.value=value;return x}function realm(id=state.realm){return state.realms.find(r=>r.id===id)}function close(){ $('#overlay').replaceChildren();$('#screen').inert=false;$('.review').inert=false;(origin?.isConnected?origin:$('#screen button'))?.focus() }function popup(title,build){origin=document.activeElement;$('#screen').inert=true;$('.review').inert=true;let shade=el('div',undefined,'shade'),box=el('section',undefined,'popup'),h=el('h1',title);h.id='popup-title';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-labelledby','popup-title');box.append(h);shade.append(box);$('#overlay').replaceChildren(shade);build(box);box.querySelector('input,textarea,select,button:not(:disabled)')?.focus()}
function render(){let s=$('#screen');s.replaceChildren();let bar=el('header',undefined,'bar');bar.append(el('h1',({register:'Conflicts',editor:'Game setup · Foreign realms',motions:'Motion lectern',proceedings:'Council proceedings'})[state.scene]),button('Close',()=>notice('In game, this closes the screen.')));s.append(bar);({register,editor,motions,proceedings})[state.scene](s)}
function split(s,items,selected,onSelect,detail){let row=el('div',undefined,'split'),list=el('div',undefined,'list'),d=el('div');items.forEach(i=>{let b=button(i.title,()=>onSelect(i.id),false,i.id===selected?'selected':'');if(i.sub)b.append(el('small',i.sub));list.append(b)});if(!items.length)list.append(p('Nothing to show.','muted'));detail(d);row.append(list,d);s.append(row)}
function register(s){let filter=select(['House conflicts','Foreign affairs']);filter.value=state.filter;filter.onchange=()=>{state.filter=filter.value;render()};s.append(field('Show',filter));if(state.filter==='House conflicts'){s.append(p('The existing public house-conflict register appears here. House peace uses the separate voluntary treaty ceremony.','muted'));return}split(s,state.realms.map(r=>({id:r.id,title:r.name,sub:r.status})),state.realm,id=>{state.realm=id;render()},d=>{let r=realm();if(!r){d.append(p('No foreign realms have been defined.','muted'));return}d.append(el('h2',r.name),p(r.status,'tag'),p(r.description,'record'),el('h2','Public record'));if(!r.history.length)d.append(p('No diplomatic decisions recorded.','muted'));r.history.forEach(h=>d.append(p(h,'record')))})}
function editor(s){if(actor()!=='Operator · Editing'){s.append(p('Foreign realm editing is available to an operator in non-active Editing Game setup.','muted'));return}s.append(actions(button('Create foreign realm…',()=>realmDialog(),false,'primary')));split(s,state.realms.map(r=>({id:r.id,title:r.name})),state.realm,id=>{state.realm=id;render()},d=>{let r=realm();if(!r){d.append(p('Create a realm to begin.','muted'));return}d.append(el('h2',r.name),p(r.description,'record'),actions(button('Edit...',()=>realmDialog(r)),button('Delete...',()=>deleteRealm(r))))})}
function deleteRealm(r){popup('Delete foreign realm?',box=>{let referenced=state.motions.some(m=>m.realmId===r.id)||r.history.length>0;box.append(p(referenced?'This realm has a motion reference or diplomatic history and cannot be deleted.':'Delete this unused realm definition?'),actions(button('Cancel',close),button('Delete',()=>{state.realms=state.realms.filter(x=>x.id!==r.id);state.realm=state.realms[0]?.id;close();notice('Unused realm deleted in the fixture.');render()},referenced)))})}
function realmDialog(r){popup(r?'Edit foreign realm':'Create foreign realm',box=>{let name=input(r?.name||''),description=textarea(r?.description||''),error=p('','tag');box.append(field('Name',name),field('Description',description),error,actions(button('Cancel',close),button('Save',()=>{if(!name.value.trim()){error.textContent='Enter a name.';return}if(r){r.name=name.value.trim();r.description=description.value.trim()}else{let id=Math.max(0,...state.realms.map(x=>x.id))+1;state.realms.push({id,name:name.value.trim(),description:description.value.trim(),status:'Not at war',revision:0,history:[]});state.realm=id}close();notice('Saved in the illustrative fixture.');render()},false,'primary')))} )}
function motions(s){s.append(actions(button('Propose…',()=>motionDialog(false),actor()!=='House representative','primary')));motionList(s,false)}
function proceedings(s){s.append(p('The Chancellor manages the existing agenda and opens or closes ballots.','muted'),actions(button('Prepare motion…',()=>motionDialog(true),actor()!=='Chancellor','primary')));motionList(s,true)}
function motionList(s,proceeding){
 split(s,state.motions.map(m=>({id:m.id,title:m.title,sub:m.stage})),state.motion,id=>{state.motion=id;render()},d=>{
  let m=state.motions.find(x=>x.id===state.motion);if(!m){d.append(p('Select a motion.','muted'));return}
  d.append(el('h2',m.title),p(`${m.type}${m.realmId?' - '+(realm(m.realmId)?.name||'Unavailable realm'):''}`,'tag'),p(m.text,'record'),p(m.stage,'muted'));
  if(m.type!=='General')d.append(p('Rule: two-thirds of the electorate captured when voting opens.','muted'));
  if(!proceeding&&m.stage==='Submitted')d.append(p('A different Council house sponsors the proposal before agenda admission.','muted'),actions(button('Sponsor',()=>{m.stage='Sponsored';render()},actor()!=='House representative')));
  if(proceeding&&actor()==='Chancellor'){
   if(['Prepared','Sponsored'].includes(m.stage))d.append(actions(button('Admit motion',()=>{m.stage='On agenda';render()})));
   if(m.stage==='On agenda')d.append(actions(button('Open vote...',()=>popup('Open vote?',b=>{b.append(p('The electorate is captured at opening. A passed foreign motion changes the public diplomatic record once.'),actions(button('Cancel',close),button('Open vote',()=>{let r=realm(m.realmId);if(m.realmId&&(!r||r.revision!==m.realmRevision)){close();notice('Realm record changed since preparation. Refresh and review the motion.');render();return}m.stage='Voting';close();render()},false,'primary')))}))));
   if(m.stage==='Voting')d.append(actions(button('Close ballot...',()=>ballotDialog(m)),button('Void ballot...',()=>popup('Void ballot?',b=>{b.append(p('A void ballot changes no diplomatic state.'),actions(button('Cancel',close),button('Void ballot',()=>{m.stage='Void';close();render()})))}))));
  }
 });
}
function motionDialog(prepared){popup(prepared?'Prepare motion':'Propose motion',box=>{let title=input(),text=textarea(),type=select(['General','Declare foreign war','Make peace']),target=select([]),extra=el('div'),error=p('','tag');function update(){extra.replaceChildren();if(type.value!=='General'){let eligible=state.realms.filter(r=>type.value==='Declare foreign war'?r.status==='Not at war':r.status==='At war');target.replaceChildren();eligible.forEach(r=>{let o=el('option',r.name);o.value=String(r.id);target.append(o)});extra.append(field('Foreign realm',target),p(eligible.length?'Current eligible realms. State will be checked again when the result is applied.':'No eligible realm is available.','muted'))}}type.onchange=update;update();box.append(field('Title',title),field('Motion text',text),field('Category',type),extra,error,actions(button('Cancel',close),button(prepared?'Prepare':'Submit',()=>{if(!title.value.trim()||!text.value.trim()){error.textContent='Enter a title and motion text.';return}if(type.value!=='General'&&!target.value){error.textContent='Choose an eligible realm.';return}let id=state.motions.length+1;state.motions.push({id,title:title.value.trim(),text:text.value.trim(),type:type.value,realmId:type.value==='General'?null:Number(target.value),realmRevision:type.value==='General'?null:realm(Number(target.value)).revision,stage:prepared?'Prepared':'Submitted'});state.motion=id;close();render()},false,'primary')))} )}
function ballotDialog(m){popup('Close ballot?',box=>{box.append(p('Close this ballot and record the result of the votes cast.'),actions(button('Cancel',close),button('Close ballot',()=>{let passed=Number($('#tally').value)>=6;if(!passed){m.stage='Failed';close();notice('No diplomatic change.');render();return}let r=realm(m.realmId),expected=m.type==='Declare foreign war'?'Not at war':'At war';if(m.type!=='General'&&(!r||r.status!==expected||r.revision!==m.realmRevision)){m.stage='Passed - effect pending review';close();notice('Realm record changed since preparation. No state was overwritten; review is needed.');render();return}m.stage='Passed';if(r){r.status=m.type==='Declare foreign war'?'At war':'Not at war';r.revision++;r.history.push(`${m.title}: Council vote passed; diplomatic state is ${r.status.toLowerCase()}.`)}close();notice('Ballot result recorded.');render()},false,'primary')))} )}
$('#aba').onclick=()=>{let r=realm();if(!r){notice('Select a realm first.');return}r.status='Not at war';r.revision+=2;r.history.push('Illustrative intervening war and peace decisions.');notice('Reviewer simulation: two intervening decisions changed the realm revision.');render()};
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=b.dataset.scene;notice('');render()});$('#actor').onchange=render;$('#reset').onclick=reset;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').children.length)close()});reset();
</script></body></html>
