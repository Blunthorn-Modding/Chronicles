<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Chronicle · Voice room workflow proposal</title>
<style>
:root{font:15px Consolas,'Courier New',monospace;color:#eee;color-scheme:dark;background:#161c1b}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}button,select,input{font:inherit}button{color:#fff;background:#737373;border:2px solid #181818;border-left-color:#bebebe;border-top-color:#bebebe;padding:5px 9px;cursor:pointer}button:hover:enabled{background:#858585}button:disabled{background:#434343;color:#aaa;cursor:default}select{background:#141414;border:2px solid #888;padding:6px;color:#fff;max-width:100%}.review{width:260px;flex:none;background:#202825;padding:18px;overflow:auto}.review h1{font-size:17px;font-weight:normal;color:#e9d39b;margin:0 0 8px}.review p,.review label{font-size:13px;line-height:1.45}.review select,.review button{width:100%;margin:3px 0;text-align:left}.review label{display:block;margin:9px 0}.review small{display:block;color:#d6dada}.pending{border-left:3px solid #e9d39b;background:#343127;padding:9px;margin:12px 0}.world{flex:1;min-width:0;display:grid;place-items:center;padding:18px;background:linear-gradient(#212824,#111715)}.frame{width:min(640px,100%);height:min(360px,calc(100vh - 36px));min-height:280px;background:#333;color:#eee;border:3px solid #141414;outline:2px solid #aaa;display:flex;flex-direction:column;padding:10px;font-size:13px}.bar,.tabs,.actions{display:flex;gap:4px;align-items:center}.bar{justify-content:space-between;margin-bottom:7px;padding-bottom:6px;border-bottom:2px solid #171717}.bar strong{font-size:15px;font-weight:normal;color:#e9d39b}.frame button{font-size:12px;padding:4px 7px;min-height:22px}.tabs button{flex:1}.content{flex:1;min-height:0;overflow:auto;padding-top:6px}.split{display:flex;gap:5px;height:100%;min-height:0}.nav{width:92px;flex:none;overflow:auto;border-right:1px solid #555;padding-right:4px}.nav button{display:block;width:100%;text-align:left;margin-bottom:3px}.nav small{display:block;color:#bab8ad;margin:8px 2px 4px}.list{width:125px;flex:none;overflow:auto;border-right:1px solid #555;padding-right:4px}.list button{display:block;width:100%;text-align:left;margin-bottom:3px}.detail{flex:1;min-width:0;overflow:auto}.card{background:#3d3d3d;border:1px solid #555;padding:7px;margin-bottom:5px;line-height:1.35;overflow-wrap:anywhere}.card strong{display:block;margin-bottom:3px;color:#e9d39b;font-weight:normal}.muted{color:#bab8ad}.warn{border-left:4px solid #bd8c54;background:#443b31;padding:7px;line-height:1.35;color:#f1e4c9;margin:5px 0}.actions{margin-top:5px;flex-wrap:wrap}.actions button{flex:1}.status{min-height:18px;color:#e6dcba;font-size:12px;padding-top:3px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:12px}.overlay[hidden]{display:none}.dialog{width:min(400px,100%);max-height:calc(100vh - 24px);overflow:auto;background:#373737;color:#eee;border:3px solid #111;outline:2px solid #aaa;padding:12px;font-size:13px}.dialog h2{font-size:16px;font-weight:normal;color:#e9d39b;margin:0 0 10px}.check{display:block;margin:8px 0}.footer{font-size:11px;color:#bab8ad;padding-top:10px}@media(max-width:640px){body{display:block}.review{width:100%;max-height:220px}.world{min-height:calc(100vh - 220px)}.frame{height:min(360px,calc(100vh - 244px));min-height:275px}.nav{width:73px}.list{width:95px}.frame button{font-size:11px;padding:3px}.detail{font-size:12px}}
</style></head><body>
<aside class="review" aria-label="Reviewer simulation controls"><h1>Voice room · workflow proposal</h1><p>Illustrative data. These controls are outside the game screen.</p><label>Actor and phase<select id="actor"><option value="edit">Operator · Editing, non-active</option><option value="off">Operator · Editing off</option><option value="active">Operator · Active session</option><option value="player">Player</option></select></label><label><input type="checkbox" id="svc" checked> Simple Voice Chat available</label><label><input type="checkbox" id="overlap"> Simulate overlapping active room bounds</label><label><input type="checkbox" id="inside"> Simulate two players in selected room</label><div class="pending"><strong>Review proposal</strong><small>Use Regions → Choose subtypes. No separate room catalogue.</small><small>Demo state stays on this page; no voice service is connected.</small></div><button id="reset">Reset illustrative data</button><div class="footer">No native behavior or privacy verification is implied.</div></aside>
<main class="world"><section class="frame" id="screen" aria-label="Proposed Regions screen"></section></main><div id="overlay" class="overlay" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
<script>
'use strict';
const $=s=>document.querySelector(s),screen=$('#screen'),overlay=$('#overlay'),dialog=$('#dialog'),actor=$('#actor'),svc=$('#svc'),overlap=$('#overlap'),inside=$('#inside');
let regions,selected,debug=false,origin,notice='';
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function btn(label,fn,disabled=false){const b=el('button',label);b.type='button';b.disabled=disabled;b.onclick=fn;return b}
function card(title,text){const c=el('div',undefined,'card');c.append(el('strong',title),document.createTextNode(text));return c}
function reset(){regions=[{name:'Council chamber',voice:true,access:true},{name:'Garden',voice:false,access:false}];selected=0;debug=false;notice='';actor.value='edit';svc.checked=true;overlap.checked=false;inside.checked=false;render()}
function guard(){return actor.value==='edit'?'':actor.value==='active'?'Region editing is unavailable during an active session.':actor.value==='off'?'Turn on Editing to change Region subtypes.':'Only an operator in Editing can change Region subtypes.'}
function render(){const r=regions[selected];screen.replaceChildren();const bar=el('div',undefined,'bar');bar.append(el('strong','Chronicle'),btn(debug?'Debug: on':'Debug: off',()=>{debug=!debug;render()}),btn('Close',()=>{notice='This closes the game screen.';render()}));screen.append(bar);const body=el('div',undefined,'content split'),nav=el('div',undefined,'nav'),list=el('div',undefined,'list'),detail=el('div',undefined,'detail');['Session','Players','Events'].forEach(x=>nav.append(btn(x,()=>{notice='Other authoring sections are outside this proposal.';render()})));nav.append(el('small','Advanced'));['Chests','Loot Tables','Regions','Locations','Game setup'].forEach(x=>nav.append(btn(x,()=>{notice='Other authoring sections are outside this proposal.';render()},x==='Regions')));list.append(el('strong','Regions'));regions.forEach((item,i)=>list.append(btn(item.name,()=>{selected=i;notice='';render()},i===selected)));detail.append(el('strong',r.name),el('p','A saved area defined by two positions.','muted'));if(r.voice){detail.append(el('p',svc.checked?'Voice room: People inside join this room together. On leaving, they return to normal proximity voice. People outside cannot hear the room.':'Voice room is configured for this Region, but currently unavailable.'));if(!svc.checked)detail.append(el('div','Voice room unavailable: Simple Voice Chat is missing. Install and enable it on the server and clients before relying on room privacy.','warn'))}else detail.append(el('p','Voice room is not enabled for this Region.','muted'));if(debug){detail.append(card('Voice room diagnostics',r.voice?(svc.checked?'Dependency: available ? Group: '+r.name+' ? Type: hidden, isolated ? Members: '+(inside.checked?'2':'0'):'Dependency: unavailable ? Room membership unavailable'):'Voice room: disabled'));if(overlap.checked)detail.append(card('Bounds check','An active Voice room overlaps these bounds in this dimension.'))}const actions=el('div',undefined,'actions');actions.append(btn('Choose subtypes...',openDialog,!!guard()));detail.append(actions);if(guard())detail.append(el('p',guard(),'muted'));body.append(nav,list,detail);screen.append(body,el('div',notice,'status'))}
function openDialog(){origin=document.activeElement;const r=regions[selected];dialog.replaceChildren();const h=el('h2','Choose subtypes');h.id='dialog-title';dialog.append(h);const accessLabel=el('label',undefined,'check'),access=el('input');access.type='checkbox';access.checked=r.access;accessLabel.append(access,document.createTextNode(' Region access'));const voiceLabel=el('label',undefined,'check'),voice=el('input');voice.type='checkbox';voice.checked=r.voice;voiceLabel.append(voice,document.createTextNode(' Voice room'));dialog.append(accessLabel,voiceLabel,el('p','Enabling creates and manages a room group automatically. Players join on entry and return to proximity voice on exit. Disabling removes the Chronicle-owned group. Rooms are restored automatically after restart.','muted'));const status=el('div','','status');status.setAttribute('role','status');const actions=el('div',undefined,'actions');actions.append(btn('Cancel',closeDialog),btn('Apply',()=>{if(guard()){status.textContent=guard();return}if(voice.checked&&!svc.checked){status.textContent='Voice room unavailable: install and enable Simple Voice Chat first.';return}if(voice.checked&&overlap.checked){status.textContent='Cannot enable Voice room: its bounds overlap another active Voice room in this dimension.';return}r.access=access.checked;r.voice=voice.checked;notice='Region subtypes updated.';closeDialog();render()}));dialog.append(status,actions);overlay.hidden=false;screen.inert=true;$('.review').inert=true;voice.focus()}
function closeDialog(){overlay.hidden=true;screen.inert=false;$('.review').inert=false;origin?.focus()}
[actor,svc,overlap,inside].forEach(n=>n.addEventListener('change',()=>{notice='';render()}));$('#reset').onclick=reset;overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeDialog()});reset();
</script></body></html>
