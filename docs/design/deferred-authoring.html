<h1>Deferred authoring: native-popup geometry reference</h1><p>Static design reference only. Each panel is logical 320×240 with the established 296×224 compact popup. Production uses Minecraft's native popup sprite, font, widgets and tooltips.</p><div class="gallery">
<figure><div class="canvas"><section class="popup"><div class="title">Scenario content</div><div class="copy">Capture current reusable content for the next build.</div><div class="copy muted">Map setup stays with this world.</div><div class="rule"></div><div class="row">Roles 4 · Lore 6 · Loot 3</div><div class="row">Events 8 · Encounters 2</div><div class="row warn">Map excluded: Regions, Locations, Chests, states, settings.</div><div class="rule"></div><div class="copy muted">Logical binding names only. Imported Events stay disabled until reviewed and bound.</div><div class="footer"><button class="wide">Export content…</button><button>Close</button></div></section></div><figcaption>Explicit header action, never a draft editor, map preset, jar writer or target toggle.</figcaption></figure>
<figure><div class="canvas"><section class="popup"><div class="title">Encounter group · Members 2/3</div><div class="copy muted">Choose reusable members. Editing never spawns.</div><div class="row"><button class="wide">Add entity…</button><button>↑</button><button>↓</button></div><div class="row"><span class="wide">Zombie · count 3</span><button>Edit</button><button>Remove</button></div><div class="row"><span class="wide">Skeleton · count 2</span><button>Edit</button><button>Remove</button></div><div class="rule"></div><div class="copy muted">Configuration appears only when server-supported.</div><div class="footer"><button>&lt;</button><button class="wide">Cancel</button><button class="wide">Save group</button><button>&gt;</button></div></section></div><figcaption>Shared CatalogAddPopup supplies search/paging; Basics → Members → Spawn uses standard arrows.</figcaption></figure>
<figure><div class="canvas"><section class="popup"><div class="title">Spawn encounter group</div><div class="copy muted">One local Event action. It does not preview or spawn.</div><div class="rule"></div><label>Encounter group</label><span class="field">Choose…</span><div class="row"><button class="wide">Use group target</button></div><div class="row"><button class="wide">Choose Region…</button><button class="wide">Choose Location…</button></div><div class="copy muted">Target stays map-owned; export retains a declared logical name only.</div><div class="footer"><button class="wide">Done</button><button class="wide">Cancel</button></div></section></div><figcaption>Event → What happens → Add action. Disabled choices have native reason tooltips.</figcaption></figure></div>
