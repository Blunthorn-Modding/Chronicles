<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ancient Forge ritual mockup</title>
<style>
  :root{color-scheme:dark;font-family:monospace}*{box-sizing:border-box}body{min-width:max-content;min-height:100vh;margin:0;padding:58px 16px 16px;background:#151515;color:#eee}.controls{position:fixed;z-index:3;top:10px;left:10px;padding:8px;border:2px solid #666;background:#292929;font-size:14px}select{margin-left:7px;border:1px solid #999;background:#111;color:#fff;font:inherit}.canvas{position:relative;width:640px;height:480px;overflow:hidden;background:radial-gradient(circle,#51585d,#282c2e 70%,#111)}.canvas[data-size="1280"]{width:1280px;height:720px}
  /* Local review extraction only. Production resolves these Minecraft IDs through GUI/item renderers; only the original basin SVG lives in this repository. */
  .panel{position:absolute;width:224px;height:212px;transform:scale(2);transform-origin:top left;color:#fff;font:9px/9px monospace}.panel::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;border:6px solid transparent;border-image:url('../../../reports/forge-ritual-preview-assets/assets/minecraft/textures/gui/sprites/popup/background.png') 6 fill stretch}.canvas[data-size="640"] .panel{left:96px;top:28px}.canvas[data-size="1280"] .panel{left:416px;top:148px}.title{position:absolute;top:12px;left:0;width:100%;height:9px}.slot{position:absolute;width:18px;height:18px;padding:1px;border:0;background:transparent url('../../../reports/forge-ritual-preview-assets/assets/minecraft/textures/gui/sprites/container/slot.png') center/18px 18px no-repeat}.item{display:block;width:16px;height:16px;image-rendering:pixelated}.entry{left:104px;top:30px}.exit{left:104px;top:96px}.basin{position:absolute;left:80px;top:56px;width:64px;height:32px;padding:0;border:0;background:transparent url('forge-basin.svg') center/64px 32px no-repeat;cursor:pointer}.basin:hover:not(:disabled),.basin:focus-visible{outline:1px solid #e8d68a;outline-offset:1px}.basin:disabled{cursor:default;filter:brightness(.65)}.lodged{position:absolute;left:104px;top:64px;display:none;pointer-events:none}.inventory,.hotbar{position:absolute;left:31px;display:grid;grid-template-columns:repeat(9,18px);gap:0}.inventory{top:126px;grid-template-rows:repeat(3,18px)}.hotbar{top:184px}.inventory .slot,.hotbar .slot{position:relative;left:auto;top:auto}.panel[data-state="first"] .entry .item,.panel[data-state="staged"] .entry .item,.panel[data-state="unavailable"] .entry .item{visibility:visible}.panel[data-state="idle"] .entry .item,.panel[data-state="lodged"] .entry .item,.panel[data-state="working"] .entry .item,.panel[data-state="success"] .entry .item,.panel[data-state="salvage"] .entry .item{visibility:hidden}.panel[data-state="lodged"] .lodged,.panel[data-state="staged"] .lodged,.panel[data-state="working"] .lodged,.panel[data-state="unavailable"] .lodged{display:block}.panel[data-state="success"] .lodged,.panel[data-state="salvage"] .lodged{display:none}.panel[data-state="working"] .basin{animation:pulse 1s steps(3,end) infinite;pointer-events:none}.panel[data-state="working"] .lodged{filter:brightness(.72)}.panel[data-state="success"] .exit,.panel[data-state="salvage"] .exit{box-shadow:inset 0 0 0 1px #c878df,0 0 2px #a55cc2}.tooltip{position:absolute;left:148px;top:66px;display:none;padding:3px 5px;background:#130c17;border:1px solid #573a63;white-space:nowrap}.basin:hover+.tooltip,.basin:focus+.tooltip{display:block}.basin:disabled+.tooltip{display:none}.note{max-width:680px;margin-top:10px;color:#bbb;font-size:13px}@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5) drop-shadow(0 0 2px #60bab4)}}
</style></head><body>
<label class="controls">Canvas <select id="size"><option value="640">640 x 480</option><option value="1280">1280 x 720</option></select> Visual state <select id="state"><option value="idle">Idle</option><option value="first">First item</option><option value="lodged">Target lodged</option><option value="staged" selected>Second item staged</option><option value="working">Working</option><option value="success">Successful result</option><option value="salvage">Salvage</option><option value="unavailable">Unavailable</option></select></label>
<main class="canvas" data-size="640"><section class="panel" data-state="staged" aria-label="Ancient Forge"><canvas class="title" id="title" width="224" height="9" aria-label="Ancient Forge"></canvas><div class="slot entry" aria-label="Entry"><img class="item" id="entryItem" src="../../../reports/forge-ritual-preview-assets/assets/minecraft/textures/item/echo_shard.png" alt=""></div><button class="basin" type="button" aria-label="Offer" title="Offer"></button><span class="tooltip">Offer</span><img class="item lodged" id="lodgedItem" src="../../../reports/forge-ritual-preview-assets/assets/minecraft/textures/item/iron_sword.png" alt=""><div class="slot exit" aria-label="Exit"><img class="item" id="outcome" alt=""></div><div class="inventory" aria-label="Player inventory"></div><div class="hotbar" aria-label="Hotbar"></div></section></main>
<p class="note">Controls sit outside the game canvas. Click a sample inventory stack to fill the entry, then click the illustrated basin: first click lodges the target; second click begins the silent ritual.</p>
<script>
const root='../../../reports/forge-ritual-preview-assets/assets/minecraft/textures/';
const items=['item/iron_sword.png','item/echo_shard.png','item/bread.png','block/torch.png','item/book.png','block/cobblestone.png','item/amethyst_shard.png','item/bow.png','item/leather.png','item/diamond.png','block/oak_log.png'];
const canvas=document.querySelector('.canvas'),panel=document.querySelector('.panel');
const size=document.querySelector('#size'),state=document.querySelector('#state');
const basin=document.querySelector('.basin'),entry=document.querySelector('#entryItem'),outcome=document.querySelector('#outcome');
for(const area of document.querySelectorAll('.inventory,.hotbar')) {
  const count=area.classList.contains('hotbar')?9:27;
  for(let i=0;i<count;i++) {
    const slot=document.createElement('button');slot.className='slot';slot.type='button';
    const image=document.createElement('img');image.className='item';image.src=root+items[i%items.length];image.alt='';slot.append(image);
    slot.onclick=()=>{if(state.value==='idle'){state.value='first';render()}else if(state.value==='lodged'){state.value='staged';render()}};
    area.append(slot);
  }
}
function render() {
  const value=state.value;panel.dataset.state=value;
  entry.src=root+(value==='first'?'item/iron_sword.png':'item/echo_shard.png');
  basin.disabled=!['first','staged'].includes(value);
  outcome.hidden=!['success','salvage'].includes(value);
  if(!outcome.hidden)outcome.src=root+(value==='success'?'item/iron_sword.png':'item/iron_ingot.png');
}
size.onchange=()=>canvas.dataset.size=size.value;
state.onchange=render;
basin.onclick=()=>{
  if(state.value==='first'){state.value='lodged';render()}
  else if(state.value==='staged'){
    state.value='working';render();
    setTimeout(()=>{if(state.value==='working'){state.value='success';render()}},1500);
  }
};
const parameters=new URLSearchParams(location.search);
if(['640','1280'].includes(parameters.get('size')))size.value=parameters.get('size');
if(['idle','first','lodged','staged','working','success','salvage','unavailable'].includes(parameters.get('state')))state.value=parameters.get('state');
canvas.dataset.size=size.value;
// Measured pinned bitmap advances avoid file-origin pixel reads in a local browser.
const advances={'A':6,'n':6,'c':6,'i':2,'e':6,'t':4,' ':4,'F':6,'o':6,'r':6,'g':6};
const font=new Image();font.src=root+'font/ascii.png';
font.onload=()=>{
  const ctx=document.querySelector('#title').getContext('2d'),value='Ancient Forge';
  const width=[...value].reduce((sum,char)=>sum+advances[char],0);let left=Math.floor((224-width)/2);
  ctx.imageSmoothingEnabled=false;
  for(const char of value){const code=char.charCodeAt(0);ctx.drawImage(font,(code%16)*8,Math.floor(code/16)*8,8,8,left,0,8,8);left+=advances[char]}
};
render();
</script></body></html>
