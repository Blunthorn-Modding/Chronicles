plugins {
    id 'fabric-loom' version "${loom_version}" apply false
}

allprojects {
    group = project_group
    version = mod_version
}

configure([project(':core'), project(':campaigns:quiet-below')]) {
    apply plugin: 'fabric-loom'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        // Official source for the optional FancyMenu/SpiffyHUD compile-only APIs.
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }

    base {
        archivesName = project.name
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    loom {
        splitEnvironmentSourceSets()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }

    // Keep JUnit's real-path/atomic-file fixtures inside the writable workspace.
    tasks.withType(Test).configureEach {
        def testTemp = layout.buildDirectory.dir("tmp/${name}/junit").get().asFile
        systemProperty 'java.io.tmpdir', testTemp.absolutePath
        doFirst { testTemp.mkdirs() }
    }

    tasks.withType(ProcessResources).configureEach {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') {
            expand version: project.version
        }
    }

    tasks.named('jar') {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
    }
}
