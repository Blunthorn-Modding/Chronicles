base { archivesName = 'last_council' }

dependencies {
    implementation project(path: ':core', configuration: 'namedElements')
    runtimeOnly "org.snakeyaml:snakeyaml-engine:${snakeyaml_engine_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Loom's test classpath resolver reads dependency-project metadata even for pure JVM tests.
    dependsOn project(':core').tasks.named('exportClasspath')
}

loom {
    runs {
        client {
            if (project.hasProperty('chronicleRunDir')) runDir = project.property('chronicleRunDir').toString()
        }
    }
    mods {
        'last_council' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        'chronicle_core' {
            sourceSet project(':core').sourceSets.main
            sourceSet project(':core').sourceSets.client
        }
    }
}

tasks.register('writeSmokeClientLaunch') {
    dependsOn tasks.named('configureClientLaunch'), tasks.named('clientClasses'), project(':core').tasks.named('clientClasses')
    doLast {
        def game = tasks.named('runClient').get()
        def config = net.fabricmc.loom.configuration.ide.RunConfig.runConfig(project, loom.runs.getByName('client'))
        def target = layout.buildDirectory.file('smoke/client-launch.json').get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            jvmArgs: game.allJvmArgs + config.vmArgs,
            classpath: game.classpath.files.collect { it.absolutePath },
            mainClass: config.mainClass, args: config.programArgs
        ]))
    }
}
